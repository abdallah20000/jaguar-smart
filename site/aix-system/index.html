function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 3400); }
async function act(fn, okMsg) { if (S.busy) return; S.busy = true; try { await fn(); if (okMsg) toast(okMsg); } catch (e) { toast(e.message || 'حصل خطأ'); } S.busy = false; render(); }
// load that must not break the whole screen: failure becomes a warning line, the rest still shows
async function T(fn, dflt) { try { const r = await fn(); return r == null ? dflt : r; } catch (e) { S.warn.push(e.message || 'خطأ'); return dflt; } }

/* -------------------------------------------- session -------------------------------------------- */
async function loadMe() {
  const me = await A.me();
  if (!me || !me.email) throw new Error('الحساب ده مش متسجّل');
  if (!DEMO && !Object.keys(me.levels || {}).length && !me.is_admin) { try { await sb.auth.signOut(); } catch (e) {} throw new Error('الحساب ده لسه مش متفعّل — كلّم عبدالله'); }
  S.me = me;
}
async function boot() {
  if (DEMO) $('banner').classList.remove('hidden');
  let signedIn = DEMO;
  if (!DEMO && sb) { try { const { data } = await sb.auth.getSession(); signedIn = !!(data && data.session); } catch (e) { signedIn = false; } }
  if (signedIn) { try { await loadMe(); } catch (e) { S.loginMsg = e.message; S.me = null; } }
  if (!location.hash) location.hash = S.me ? '#home' : '#login';
  route();
}
const ROUTES = ['login', 'home', 'approvals', ...MODULES.map((m) => m.k)];
async function route() {
  const r = (location.hash || '#login').slice(1).split('?')[0];
  S.route = ROUTES.includes(r) ? r : 'home';
  if (!S.me && S.route !== 'login') { location.hash = '#login'; return; }
  if (S.me && S.route === 'login') { location.hash = '#home'; return; }
  if (MOD[S.route] && !can(S.route, 'view')) { location.hash = '#home'; return; }
  S.sheet = null; S.warn = []; render();
  if (S.route !== 'login' && S.route !== 'home') act(() => loadRoute(S.route));
  if (S.route === 'home') act(loadHomeCount);
}
window.addEventListener('hashchange', route);
async function doLogin(email, pass) {
  if (!email || (!DEMO && !pass)) { S.loginMsg = 'اكتب الإيميل والباسورد'; return render(); }
  S.loginMsg = ''; S.busy = true; render();
  try {
    if (!DEMO) { const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw new Error('الإيميل أو الباسورد غلط'); }
    await loadMe(); S.busy = false; if (location.hash === '#home') route(); else location.hash = '#home';
  } catch (e) { S.loginMsg = e.message; S.busy = false; if (!DEMO && sb) { try { await sb.auth.signOut(); } catch (x) {} } S.me = null; render(); }
}
async function doLogout() { if (!DEMO && sb) { try { await sb.auth.signOut(); } catch (e) {} } S.me = null; S.loginMsg = ''; location.hash = '#login'; route(); }

const D = S.d;
async function loadRoute(r) {
  S.warn = [];
  if (r === 'approvals') return loadApprovals();
  if (r === 'users') { const [t, c, q] = await Promise.all([T(() => A.team(), []), T(() => A.catalog(), []), can('users', 'approve') ? T(() => A.requests(), []) : []]); D.team = t; D.catalog = c; D.requests = q; return; }
  if (r === 'inventory') { const [i, m, l] = await Promise.all([T(() => A.items(), []), T(() => A.moves(null), []), T(() => A.installLines(), [])]); D.items = i; D.moves = m; D.lines = l; return; }
  if (r === 'sales') { const [l, q, p, t] = await Promise.all([T(() => A.leads(), []), T(() => A.quotes(), []), T(() => A.products(), []), T(() => A.tasks(), [])]); D.leads = l; D.quotes = q; D.products = p; D.tasks = t; return; }
  if (r === 'projects') { const [i, j, it, t] = await Promise.all([T(() => A.installs(), []), T(() => A.jobs(), []), T(() => A.items(), []), T(() => A.tasks(), [])]); D.installs = i; D.jobs = j; D.items = it; D.tasks = t; return; }
  if (r === 'purchasing') { D.purchases = await T(() => A.purchases(), null); return; }
  if (r === 'accounts') { D.invoices = await T(() => A.invoices(), null); return; }
  if (r === 'hr') { D.employees = await T(() => A.employees(), null); return; }
  if (r === 'reports') { const [l, q, i, it, ap] = await Promise.all([T(() => A.leads(), []), T(() => A.quotes(), []), T(() => A.installs(), []), T(() => A.items(), []), collectApprovals()]); Object.assign(D, { leads: l, quotes: q, installs: i, items: it, appr: ap }); }
}
async function collectApprovals() {   // one list from every module the person may approve in
  const out = [];
  if (can('sales', 'approve')) {
    const q = await T(() => A.quotes(), []);
    q.filter((x) => x.discount_status === 'pending').forEach((x) => out.push({ kind: 'disc', mod: 'sales', id: x.id, title: x.quote_number + ' · ' + x.client_name, sub: 'طلب موافقة على خصم · ' + short(x.discount_requested_by) + ' · إجمالي ' + money(x.total), q: x }));
    q.filter((x) => x.delete_requested_at).forEach((x) => out.push({ kind: 'del', mod: 'sales', id: x.id, title: x.quote_number + ' · ' + x.client_name, sub: 'طلب مسح عرض سعر · ' + short(x.delete_requested_by), q: x }));
  }
  if (can('users', 'approve')) (await T(() => A.requests(), [])).forEach((x) => out.push({ kind: 'join', mod: 'users', id: x.id, title: x.full_name || x.email, sub: 'طلب انضمام · ' + x.email }));
  if (can('purchasing', 'approve')) { const p = await T(() => A.purchases(), null); (p || []).filter((x) => x.status === 'pending').forEach((x) => out.push({ kind: 'po', mod: 'purchasing', id: x.id, title: x.no + ' · ' + x.supplier, sub: 'أمر شراء مستني موافقة · ' + money(x.total) + ' ج' })); }
  if (isAdmin()) (await T(() => A.decisions(), [])).forEach((x) => out.push({ kind: 'dec', mod: 'users', id: x.id, title: x.title, sub: 'قرار مستني الإدارة', opts: x.options || [], det: x.details }));
  return out;
}

function qCalc(qt) {
  const sub = (qt.items || []).reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.unit_price) || 0) * (1 - (Number(i.discount_pct) || 0) / 100), 0), instPct = Number(qt.install_pct) || 0, discPct = Number(qt.discount_pct) || 0;
  const inst = Math.round(sub * instPct / 100), disc = Math.round((sub + inst) * discPct / 100), gross = (qt.items || []).reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.unit_price) || 0), 0);
  const eff = gross <= 0 ? discPct / 100 : 1 - sub * (1 - discPct / 100) / gross;   // same rule as crm.html: approval needed above 20%
  return { sub, instPct, inst, discPct, disc, total: sub + inst - disc, needs: eff > 0.2001 };
}

  if (q.id && can('sales', 'approve')) h += '<button class="nob" data-act="qdelete">مسح العرض</button>';

function render() {
  const app = $('app'), host = $('sheetHost'), prev = host.querySelector('.sheet'), top = prev ? prev.scrollTop : 0;
  let h = '';
  if (S.route === 'login' || !S.me) h = vLogin();
  else if (S.route === 'home') h = vHome();
  else if (S.route === 'approvals') h = vApprovals();
  else if (S.route === 'users') h = vUsers();
  else if (S.route === 'inventory') h = vInventory();
  else if (S.route === 'sales') h = vSales();
  else if (S.route === 'purchasing') h = vPurchasing();
  else if (S.route === 'accounts') h = vAccounts();
  else if (S.route === 'projects') h = vProjects();
  else if (S.route === 'hr') h = vHr();
  else if (S.route === 'reports') h = vReports();
  app.innerHTML = h; host.innerHTML = vSheet();
  const sh = host.querySelector('.sheet'); if (sh && prev) sh.scrollTop = top;

/* -------------------------------------------- events -------------------------------------------- */
const fd = (form) => Object.fromEntries(new FormData(form).entries());
const nz = (v) => { v = String(v == null ? '' : v).trim(); return v === '' ? null : v; };
const reload = () => loadRoute(S.route);
function newQuote(lead) { return { id: null, quote_number: null, lead_id: lead ? lead.id : null, client_name: lead ? lead.name : '', client_type: 'end_user', quote_date: today(), valid_until: null, status: 'draft', install_pct: 10, discount_pct: 0, notes: null, items: [], discount_status: null, dirty: false }; }

async function saveQuote() {
  const q = S.quote, t = qCalc(q), items = q.items.filter((i) => String(i.name || '').trim());
  if (!String(q.client_name || '').trim()) throw new Error('اكتب اسم العميل');

  if (items.some((i) => !(Number(i.qty) > 0))) throw new Error('العدد لازم يكون أكبر من صفر');
  const row = { lead_id: q.lead_id || null, client_name: q.client_name.trim(), client_type: q.client_type, quote_date: q.quote_date, valid_until: q.valid_until || null, status: q.status, subtotal: t.sub, install_pct: t.instPct, install_amount: t.inst, discount_pct: t.discPct, discount_amount: t.disc, total: t.total, notes: q.notes || null };
  const r = await A.saveQuote(row, items, q.id); q.id = r.id; q.quote_number = r.quote_number; q.items = items; q.dirty = false;
  D.quotes = await T(() => A.quotes(), D.quotes || []);
  const fresh = D.quotes.find((x) => x.id === q.id); if (fresh) { q.discount_status = fresh.discount_status; q.discount_note = fresh.discount_note; q.delete_requested_at = fresh.delete_requested_at; }

document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('form[data-form]'); if (!f) return; ev.preventDefault();
  const k = f.dataset.form, v = fd(f), rec = S.sheet && S.sheet.rec;
  if (k === 'login') return void doLogin(String(v.email || f.querySelector('#lgE').value).trim().toLowerCase(), f.querySelector('#lgP').value);

  if (k === 'leadsave') return void act(async () => { const row = { name: v.name.trim(), phone: v.phone.trim(), area: nz(v.area), source: v.source, client_type: (rec && rec.client_type) || 'end_user', status: v.status, budget: v.budget ? Number(v.budget) : null, assigned_to: nz(v.assigned_to), next_follow_up: v.next_follow_up || null, notes: nz(v.notes) }; await A.saveLead(row, rec && rec.id); S.sheet = null; await reload(); }, 'اتحفظ');

  if (k === 'prodsave') return void act(async () => { const row = { code: nz(v.code), name: v.name.trim(), category: v.category, brand: nz(v.brand), end_user_price: v.end_user_price === '' ? null : Number(v.end_user_price), dealer_price: v.dealer_price === '' ? null : Number(v.dealer_price), active: !!v.active }; await A.saveProduct(row, rec && rec.id); S.sheet = null; await reload(); }, 'اتحفظ');

document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'closesheet' && ev.target.closest('[data-stop]') && !ev.target.closest('button[data-act="closesheet"]')) return;
  const a = t.dataset.act, id = t.dataset.id, rec = S.sheet && S.sheet.rec;
  if (a === 'forgot') { S.forgot = true; return render(); }
  if (a === 'go') { location.hash = '#' + t.dataset.to; return; }
  if (a === 'home') { location.hash = '#home'; return; }

  if (a === 'closesheet') { S.sheet = null; S.quote = null; return render(); }

  if (a === 'leadform') { S.sheet = { kind: 'lead', rec: null }; return render(); }

  if (a === 'ret') { if (!confirm('ترجّع ده للمخزن؟')) return; return void act(async () => { await A.ret(id); D.items = await A.items(); S.sheet.parts = await A.parts(rec.id); }, 'رجع للمخزن'); }

  if (a === 'qreq') return void act(async () => { if (S.quote.dirty || !S.quote.id) await saveQuote(); await A.requestDisc(S.quote.id); await saveQuoteRefresh(); await reload(); }, 'الطلب اتبعت للأدمن');
  if (a === 'qrev') { const ok = t.dataset.ok === '1'; const note = ok ? null : prompt('سبب الرفض (اختياري):'); if (!ok && note === null) return; return void act(async () => { if (S.quote.dirty || !S.quote.id) await saveQuote(); await A.reviewDisc(S.quote.id, ok, note); await saveQuoteRefresh(); await reload(); }, ok ? 'وافقت على الخصم' : 'الخصم اترفض'); }
  if (a === 'qreqdel') { if (!confirm('تبعت للأدمن طلب يمسح العرض ده؟')) return; return void act(async () => { await A.requestDel(S.quote.id); await saveQuoteRefresh(); await reload(); }, 'الطلب اتبعت للأدمن'); }
  if (a === 'qdelete') { if (!confirm('مسح عرض السعر نهائيًا؟ مفيش رجوع.')) return; return void act(async () => { await A.deleteQuote(S.quote.id); S.sheet = null; S.quote = null; await reload(); }, 'العرض اتمسح'); }
  if (a === 'reqdec') return void act(async () => { await A.decideRequest(id, t.dataset.ok === '1'); await reload(); }, 'اتسجّل');
  if (a === 'appr') {
    const i = +t.dataset.i, x = D.appr[i], ok = t.dataset.ok === '1';
    return void act(async () => {
      if (x.kind === 'disc') { const note = ok ? null : prompt('سبب الرفض (اختياري):'); if (!ok && note === null) return; await A.reviewDisc(x.id, ok, note); }

      await loadApprovals();

  }
});
