<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>الصفحة مش موجودة</title>
<style>html,body{margin:0;height:100%;background:#111;color:#999;font:15px/1.6 system-ui,sans-serif}body{display:grid;place-items:center}</style>
</head>
<body>
<p>الصفحة دي مش موجودة.</p>
<script>
// remove any installed copy of the old app from this phone
if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
</script>
</body>
</html>
