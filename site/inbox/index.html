<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>كل الرسايل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Layout: owner-only inbox in three columns (sections, conversations, chat), like a desktop mail client.
   On a phone the sections become a scrolling row and the chat opens over the list. */
:root{
  --bg:#eef1f4; --surface:#fff; --soft:#f6f7f9; --hover:#f1f4f6; --active:#e4f2f0; --line:#e3e7ec;
  --ink:#17202b; --muted:#667382; --faint:#8c97a4;
  --accent:#0f766e; --accent-ink:#fff; --accent-soft:#d9f0ed;
  --bubble-in:#fff; --bubble-out:#dcf3ee; --chat:#e9edf0; --bad:#c2410c; --bad-soft:#ffedd5;
  --shahi:#b7791f; --nile:#2563eb; --jaguar:#15803d; --personal:#7c3aed; --accounting:#c2410c; --tuya:#0891b2; --wechat:#16a34a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{background:#0b5f58}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover)}
input,textarea{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* login */
.gate{min-height:100%;display:grid;place-items:center;padding:20px 16px}
.gate form{width:100%;max-width:380px;background:var(--surface);border-radius:18px;padding:30px 26px;display:grid;gap:14px;box-shadow:0 12px 40px rgba(23,32,43,.08)}
.gate h1{margin:0;font-size:26px;font-weight:800}
.gate p{margin:-8px 0 4px;color:var(--muted);font-size:14px}
.gate label{font-size:14px;font-weight:600;display:grid;gap:5px}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:0}
/* shell */
.app{height:100%;display:grid;grid-template-columns:230px 350px minmax(0,1fr)}
.nav{background:#12332f;color:#e8f3f1;display:flex;flex-direction:column;padding:18px 12px;min-height:0;overflow-y:auto}
.nav h1{margin:0 8px 16px;font-size:21px;font-weight:800}
.sec{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:9px 10px;color:#cfe3e0;cursor:pointer;text-align:start;font-weight:600}
.sec:hover{background:rgba(255,255,255,.07)}
.sec[aria-pressed="true"]{background:rgba(255,255,255,.14);color:#fff}
.sec i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,#fff)}
.sec span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec b{font-weight:600;font-size:13px;opacity:.8;font-variant-numeric:tabular-nums}
.sec.need b{background:#f59e0b;color:#2a1a00;opacity:1;border-radius:999px;padding:0 8px;font-weight:800}
.nav hr{border:0;border-top:1px solid rgba(255,255,255,.14);margin:10px 8px}
.foot{margin-top:auto;padding:12px 8px 0;display:grid;gap:8px}
.sync{font-size:12px;color:#a9c7c2}
.foot .btn{min-height:36px;background:rgba(255,255,255,.1);color:#fff}
.foot .btn:hover{background:rgba(255,255,255,.18)}
.side{background:var(--surface);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:16px 14px 10px}
.head h2{margin:0 0 10px;font-size:20px;font-weight:800}
.list{flex:1;overflow-y:auto;padding:0 8px 10px}
.day{font-size:12px;font-weight:700;color:var(--faint);padding:12px 8px 4px}
.conv{display:flex;gap:10px;width:100%;align-items:center;text-align:start;background:none;border:0;border-radius:12px;padding:9px 8px;cursor:pointer}
.conv:hover{background:var(--hover)}
.conv[aria-current="true"]{background:var(--active)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--c,#667382);font-size:17px}
.av.sm{width:38px;height:38px;font-size:15px}
.ci{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r1 time{font-size:12px;color:var(--faint);white-space:nowrap;flex:none}
.r2{display:flex;align-items:center;gap:6px;margin-top:1px}
.r2 p{margin:0;flex:1;min-width:0;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b;flex:none}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--bad-soft);color:var(--bad);white-space:nowrap;flex:none}
.brand{font-size:12px;font-weight:700;color:var(--c,var(--muted))}
/* chat */
.thread{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chat)}
.th{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.th .who{flex:1;min-width:0}
.th h2{margin:0;font-size:17px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th small{color:var(--muted);font-size:13px}
.th .ph{direction:ltr;unicode-bidi:isolate}
.msgs{flex:1;overflow-y:auto;padding:14px 8%;display:flex;flex-direction:column;gap:6px}
.dayline{align-self:center;background:rgba(255,255,255,.85);color:var(--muted);font-size:12px;font-weight:700;border-radius:8px;padding:2px 12px;margin:10px 0 4px}
.m{max-width:min(70%,560px);padding:7px 12px 5px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bubble-in);align-self:flex-start;box-shadow:0 1px 1px rgba(23,32,43,.06)}
.m.out{align-self:flex-end;background:var(--bubble-out)}
.m .sender{display:block;font-size:13px;font-weight:700;color:var(--accent)}
.m .media{color:var(--muted);font-style:normal;font-weight:600}
.m a{color:var(--accent);font-weight:700}
.m small{display:block;font-size:11px;color:var(--faint);margin-top:2px;text-align:start}
.compose{background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:6px}
.compose .row{display:flex;gap:8px;align-items:flex-end}
.compose textarea{min-height:42px;max-height:130px;height:42px;resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:0}
.empty{margin:auto;color:var(--muted);text-align:center;padding:32px 16px}
.welcome{margin:auto;text-align:center;color:var(--muted);padding:24px}
.welcome b{display:block;font-size:20px;color:var(--ink);margin-bottom:4px}
.back{display:none}
/* views */
.views{display:grid;gap:2px;margin-bottom:6px}
.view{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:9px 10px;color:#fff;cursor:pointer;text-align:start;font-weight:700}
.view:hover{background:rgba(255,255,255,.07)}
.view[aria-pressed="true"]{background:var(--accent)}
.view b{margin-inline-start:auto;background:#f59e0b;color:#2a1a00;border-radius:999px;padding:0 8px;font-size:13px;font-weight:800}
.app.pageview{grid-template-columns:230px minmax(0,1fr)}
.app.pageview .side,.app.pageview .thread,.app.pageview #sections{display:none!important}
.page{overflow-y:auto;padding:24px clamp(16px,3vw,36px);min-width:0}
.page h2{margin:0 0 4px;font-size:24px;font-weight:800}
.page .sub{margin:0 0 18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:start;cursor:pointer;min-width:0}
.stat:hover{border-color:var(--accent)}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.stat.warn b{color:#b45309}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 8px;font-size:16px;font-weight:800;display:flex;justify-content:space-between;gap:8px}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:13px}
.line{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.line:first-of-type{border-top:0}
.line .tx{flex:1;min-width:0}
.line .tt{font-weight:700}
.line p{margin:1px 0 0;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.line time{font-size:12px;color:var(--faint);white-space:nowrap;flex:none}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft)}
.ic.alert{background:var(--bad-soft)}
.state{font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;white-space:nowrap;flex:none}
.state.ok{background:var(--accent-soft);color:var(--accent)}
.state.late{background:var(--bad-soft);color:var(--bad)}
.state.none{background:var(--hover);color:var(--muted)}
.flows{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.flow .top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:4px}
.flow h3{margin:0}
.flow p{margin:0;color:var(--muted);font-size:14px}
.flow small{display:block;margin-top:8px;color:var(--faint);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;cursor:pointer;font-weight:700;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (max-width:1050px){.app{grid-template-columns:190px 300px minmax(0,1fr)}.app.pageview{grid-template-columns:190px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .app{display:flex;flex-direction:column}
  .app.pageview{display:flex}
  .views{display:flex;gap:4px;margin:0;flex:none}
  .view{width:auto;flex:none;padding:6px 10px}
  .cols{grid-template-columns:minmax(0,1fr)}
  .page{flex:1;padding:16px}
  .nav{flex-direction:row;align-items:center;gap:6px;padding:8px 12px;overflow-x:auto;overflow-y:hidden;flex:none;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav h1,.nav hr,.foot{display:none}
  .sec{width:auto;flex:none;padding:6px 10px}
  .sec span{overflow:visible}
  .side{flex:1;border:0}
  .app.open .side,.app.open .nav{display:none}
  .app:not(.open) .thread{display:none}
  .thread{flex:1}
  .back{display:inline-flex}
  .msgs{padding:12px}
  .m{max-width:86%}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="auth">
    <h1>كل الرسايل</h1>
    <p>لوحة خاصة بصاحب الحساب.</p>
    <label>الإيميل<input id="email" type="email" autocomplete="username" dir="ltr" required></label>
    <label>الباسورد<input id="pw" type="password" autocomplete="current-password" dir="ltr" required></label>
    <p class="err" id="authErr" aria-live="polite"></p>
    <button class="btn" type="submit" id="authBtn">دخول</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <nav class="nav" aria-label="الأقسام">
    <h1>الداشبورد</h1>
    <div class="views" id="views"></div>
    <hr>
    <div id="sections" style="display:contents"></div>
    <div class="foot">
      <div class="sync" id="sync" aria-live="polite"></div>
      <button class="btn" type="button" id="logout">خروج</button>
    </div>
  </nav>
  <aside class="side">
    <div class="head">
      <h2 id="listTitle">الكل</h2>
      <input id="q" type="search" placeholder="دوّر باسم أو رقم أو كلمة" aria-label="بحث في المحادثات">
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main class="thread" id="thread"><div class="welcome"><b>اختار محادثة</b>هتظهر هنا كل الرسايل بتاعتها</div></main>
  <main class="page" id="page" hidden></main>
</div>

<script>
(function(){
  var API='https://n8n-hesb.srv2112249.hstgr.cloud/webhook/all-inbox';
  var sb=supabase.createClient('https://snrsfpprlynixotjipmo.supabase.co','sb_publishable_Q9zcnd6bo1cM4VDRysyjbA_XBr6lhds');
  /* key, label, colour variable */
  var GROUPS=[[['all','الكل','#fff'],['need','محتاج رد','#f59e0b']],[['shahi','شاهي','var(--shahi)'],['nile','Nile','var(--nile)'],['jaguar','Jaguar','var(--jaguar)']],[['personal','واتساب بتاعي','var(--personal)'],['accounting','جروبات الحسابات','var(--accounting)'],['tuya','جروب Tuya','var(--tuya)'],['wechat','WeChat','var(--wechat)']]];
  var BRAND={};GROUPS.forEach(function(g){g.forEach(function(b){BRAND[b[0]]={label:b[1],color:b[2]}})});
  var BUSINESS={shahi:1,nile:1,jaguar:1};
  var MEDIA=[[/image/i,'📷 صورة'],[/audio|ptt|voice/i,'🎤 ريكورد'],[/video/i,'🎬 فيديو'],[/document|file/i,'📄 ملف'],[/sticker/i,'ستيكر'],[/location/i,'📍 لوكيشن'],[/contact/i,'👤 جهة اتصال'],[/reaction/i,'تفاعل'],[/interactive/i,'زرار'],[/./,'رسالة']];
  var $=function(id){return document.getElementById(id)};
  var VIEWS=[['home','الرئيسية'],['messages','الرسايل'],['notes','التنبيهات'],['flows','الأتمتة']];
  var STATE={ok:'شغال',late:'متأخر',none:'لسه ما اشتغلش'};
  var rows=[],total=0,filter='all',current=null,timer=null,seq=0;
  var view='home',notes=[],flows=[],noteTab='all',overviewFailed=false;

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function media(type){for(var i=0;i<MEDIA.length;i++)if(MEDIA[i][0].test(type||''))return MEDIA[i][1]}
  /* raw placeholders such as [imageMessage] become plain words */
  function clean(text,type){
    var t=String(text||'').replace('[يدوي] ','').trim(),m=t.match(/^\[([A-Za-z]+)\]$/);
    if(!t)return media(type);
    return m?media(m[1]):t;
  }
  function isMedia(text){var t=String(text||'').trim();return !t||/^\[[A-Za-z]+\]$/.test(t)}
  function dayKey(d){var t=new Date(d);return isNaN(t)?'':t.toDateString()}
  function dayName(d){
    var t=new Date(d);if(isNaN(t))return '';
    var today=new Date(),y=new Date();y.setDate(today.getDate()-1);
    if(t.toDateString()===today.toDateString())return 'النهارده';
    if(t.toDateString()===y.toDateString())return 'امبارح';
    return t.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  }
  function clock(d){var t=new Date(d);return isNaN(t)?'':t.toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}
  function when(d){return dayKey(d)===new Date().toDateString()?clock(d):new Date(d).toLocaleDateString('ar-EG',{day:'numeric',month:'short'})}
  function norm(s){return String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')}
  function initial(c){var n=String(c.name||'').trim();return n&&!/^[+\d]/.test(n)?n.charAt(0).toUpperCase():'#'}
  function needsReply(c){return BUSINESS[c.brand]&&c.lastDir==='in'}
  function avatar(c,small){var a=el('span','av'+(small?' sm':''),initial(c));a.style.setProperty('--c',(BRAND[c.brand]||{}).color||'#667382');a.setAttribute('aria-hidden','true');return a}
  function call(action,extra){
    return sb.auth.getSession().then(function(r){
      var s=r.data.session;if(!s){showGate();throw new Error('سجّل دخولك تاني')}
      return fetch(API,{method:'POST',body:new URLSearchParams(Object.assign({action:action,token:s.access_token},extra||{}))});
    }).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(r.status===401)showGate();
        if(!r.ok)throw new Error(j.error||'حصلت مشكلة. جرّب تاني');
        return j;
      });
    });
  }

  /* auth */
  function showGate(){clearInterval(timer);$('app').hidden=true;$('gate').hidden=false}
  function enter(){
    $('gate').hidden=true;$('app').hidden=false;
    refresh();clearInterval(timer);
    timer=setInterval(function(){if(!document.hidden)refresh()},60000);
  }
  $('auth').addEventListener('submit',function(e){
    e.preventDefault();var btn=$('authBtn'),err=$('authErr');err.textContent='';btn.disabled=true;
    sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value}).then(function(r){
      if(r.error){err.textContent='الإيميل أو الباسورد غلط';return}
      $('pw').value='';enter();
    }).catch(function(){err.textContent='مفيش اتصال. جرّب تاني'}).then(function(){btn.disabled=false});
  });
  $('logout').onclick=function(){sb.auth.signOut().then(function(){current=null;showGate()})};

  /* views */
  function todayNotes(){return notes.filter(function(n){return dayKey(n.at)===new Date().toDateString()})}
  function badFlows(){return flows.filter(function(f){return f.state==='late'})}
  function renderViews(){
    var box=$('views');box.textContent='';
    VIEWS.forEach(function(v){
      var b=el('button','view',v[1]);b.type='button';b.setAttribute('aria-pressed',view===v[0]?'true':'false');
      var n=v[0]==='messages'?countOf('need'):v[0]==='notes'?todayNotes().length:v[0]==='flows'?badFlows().length:0;
      if(n)b.appendChild(el('b',null,n));
      b.onclick=function(){go(v[0])};
      box.appendChild(b);
    });
  }
  function go(v,f){
    view=v;if(f)filter=f;
    var messages=view==='messages';
    $('app').classList.toggle('pageview',!messages);
    $('page').hidden=messages;
    renderViews();
    if(messages){renderSections();renderList()}else renderPage();
  }
  function renderPage(){
    var box=$('page');box.textContent='';
    if(overviewFailed)box.appendChild(el('p','hint','مقدرناش نجيب آخر التنبيهات. هنجرب تاني في التحديث الجاي.'));
    if(view==='home')renderHome(box);else if(view==='notes')renderNotes(box);else renderFlows(box);
  }
  function stat(box,n,label,go2,warn){
    var b=el('button','stat'+(warn&&n?' warn':''));b.type='button';b.appendChild(el('b',null,n));b.appendChild(el('span',null,label));b.onclick=go2;box.appendChild(b);
  }
  function noteLine(box,n){
    var r=el('div','line');r.appendChild(el('span','ic'+(n.kind==='alert'?' alert':''),n.kind==='alert'?'🔔':'🧲'));
    var tx=el('div','tx');tx.appendChild(el('div','tt',n.title+(n.business?' · '+n.business:'')));
    tx.appendChild(el('p',null,[n.who,n.text].filter(Boolean).join(' — ')));
    r.appendChild(tx);r.appendChild(el('time',null,when(n.at)));box.appendChild(r);
  }
  function renderHome(box){
    box.appendChild(el('h2',null,'الرئيسية'));box.appendChild(el('p','sub',dayName(new Date())+'، ودي أهم حاجة عندك دلوقتي.'));
    var s=el('div','stats');
    stat(s,countOf('need'),'محتاج رد',function(){go('messages','need')},true);
    stat(s,todayNotes().length,'تنبيهات النهارده',function(){go('notes')});
    stat(s,total,'كل المحادثات',function(){go('messages','all')});
    stat(s,badFlows().length,'أتمتة متأخرة',function(){go('flows')},true);
    box.appendChild(s);
    var c=el('div','cols');
    var a=el('section','card'),h=el('h3',null,'محتاج رد');var more=el('button','link','عرض الكل');more.type='button';more.onclick=function(){go('messages','need')};h.appendChild(more);a.appendChild(h);
    var need=rows.filter(needsReply).slice(0,5);
    if(!need.length)a.appendChild(el('p','hint','مفيش حد مستني رد 🎉'));
    need.forEach(function(x){
      var r=el('div','line');r.appendChild(avatar(x,true));
      var tx=el('div','tx');tx.appendChild(el('div','tt',x.name||x.phone));tx.appendChild(el('p',null,clean(x.last)));r.appendChild(tx);r.appendChild(el('time',null,when(x.lastAt)));
      r.style.cursor='pointer';r.onclick=function(){go('messages','need');open(x.id,false)};a.appendChild(r);
    });
    var b=el('section','card'),h2=el('h3',null,'آخر التنبيهات');var more2=el('button','link','عرض الكل');more2.type='button';more2.onclick=function(){go('notes')};h2.appendChild(more2);b.appendChild(h2);
    if(!notes.length)b.appendChild(el('p','hint','مفيش تنبيهات'));
    notes.slice(0,5).forEach(function(n){noteLine(b,n)});
    c.appendChild(a);c.appendChild(b);box.appendChild(c);
  }
  function renderNotes(box){
    box.appendChild(el('h2',null,'التنبيهات'));box.appendChild(el('p','sub','تنبيهات البوت والعملاء الجداد في مكان واحد.'));
    var t=el('div','tabs');
    [['all','الكل'],['alert','تنبيهات البوت'],['lead','عملاء جداد']].forEach(function(x){
      var b=el('button','tab',x[1]);b.type='button';b.setAttribute('aria-pressed',noteTab===x[0]?'true':'false');b.onclick=function(){noteTab=x[0];renderPage()};t.appendChild(b);
    });
    box.appendChild(t);
    var list=notes.filter(function(n){return noteTab==='all'||n.kind===noteTab}),card=el('section','card');
    if(!list.length)card.appendChild(el('p','hint','مفيش حاجة هنا'));
    list.forEach(function(n){noteLine(card,n)});
    box.appendChild(card);
  }
  function renderFlows(box){
    box.appendChild(el('h2',null,'الأتمتة'));box.appendChild(el('p','sub','الحالة محسوبة من آخر مرة سجّل فيها كل نظام حاجة، مش من n8n مباشرة.'));
    var g=el('div','flows');
    flows.forEach(function(f){
      var c=el('section','card flow'),t=el('div','top');t.appendChild(el('h3',null,f.name));t.appendChild(el('span','state '+f.state,STATE[f.state]));
      c.appendChild(t);c.appendChild(el('p',null,f.desc));c.appendChild(el('small',null,f.lastAt?'آخر نشاط: '+dayName(f.lastAt)+' '+clock(f.lastAt):'مفيش نشاط مسجل'));g.appendChild(c);
    });
    box.appendChild(g);
  }

  /* sections */
  function countOf(key){
    if(key==='all')return total;
    if(key==='need')return rows.filter(needsReply).length;
    return rows.filter(function(c){return c.brand===key}).length;
  }
  function renderSections(){
    var box=$('sections');box.textContent='';
    GROUPS.forEach(function(g,i){
      if(i)box.appendChild(el('hr'));
      g.forEach(function(b){
        var n=countOf(b[0]);
        var s=el('button','sec'+(b[0]==='need'&&n?' need':''));s.type='button';s.setAttribute('aria-pressed',filter===b[0]?'true':'false');
        var dot=el('i');dot.style.setProperty('--c',b[2]);s.appendChild(dot);
        s.appendChild(el('span',null,b[1]));s.appendChild(el('b',null,n));
        s.onclick=function(){filter=b[0];renderSections();renderList()};
        box.appendChild(s);
      });
    });
  }

  /* conversations */
  function renderList(){
    var box=$('list'),q=norm($('q').value);box.textContent='';
    $('listTitle').textContent=BRAND[filter].label;
    var items=rows.filter(function(c){
      if(filter==='need'?!needsReply(c):(filter!=='all'&&c.brand!==filter))return false;
      return !q||norm(c.name+' '+c.phone+' '+c.last).indexOf(q)>-1;
    });
    if(!items.length){box.appendChild(el('p','empty',filter==='need'?'مفيش حد مستني رد 🎉':'مفيش محادثات هنا'));return}
    var day='';
    items.forEach(function(c){
      var k=dayKey(c.lastAt);
      if(k!==day){day=k;box.appendChild(el('div','day',dayName(c.lastAt)))}
      var b=el('button','conv');b.type='button';
      if(c.id===current)b.setAttribute('aria-current','true');
      b.appendChild(avatar(c));
      var ci=el('span','ci'),r1=el('span','r1');r1.style.display='flex';
      r1.appendChild(el('span','nm',c.name||c.phone));r1.appendChild(el('time',null,when(c.lastAt)));
      var r2=el('span','r2');r2.style.display='flex';
      var p=el('p',null,clean(c.last));r2.appendChild(p);
      if(c.paused)r2.appendChild(el('span','pill','البوت موقوف'));
      if(needsReply(c))r2.appendChild(el('span','dot'));
      ci.appendChild(r1);ci.appendChild(r2);
      if(filter==='all'||filter==='need'){var br=el('span','brand',(BRAND[c.brand]||{}).label||'');br.style.setProperty('--c',(BRAND[c.brand]||{}).color||'');ci.appendChild(br)}
      b.appendChild(ci);
      b.onclick=function(){open(c.id,false)};
      box.appendChild(b);
    });
  }
  function refresh(){
    return Promise.all([call('list'),call('overview').catch(function(){overviewFailed=true;return null})]).then(function(r){
      var d=r[0];
      rows=d.conversations;total=d.total;
      if(r[1]){notes=r[1].notifications;flows=r[1].flows;overviewFailed=false}
      $('sync').textContent='آخر تحديث '+clock(new Date());
      renderViews();
      if(view==='messages'){renderSections();renderList();if(current)open(current,true)}else renderPage();
    }).catch(function(x){$('sync').textContent=x.message==='Failed to fetch'?'مفيش اتصال بالسيرفر':x.message});
  }
  $('q').addEventListener('input',renderList);

  /* chat */
  function open(id,quiet){
    var mine=++seq;current=id;$('app').classList.add('open');
    if(!quiet)renderList();
    return call('thread',{id:id}).then(function(t){
      if(mine!==seq)return;
      var keep=$('reply')?$('reply').value:'',old=$('msgs');
      var atEnd=!old||old.scrollHeight-old.scrollTop-old.clientHeight<60;
      renderThread(t);
      if(quiet&&keep&&$('reply'))$('reply').value=keep;
      var m=$('msgs');if(atEnd||!quiet)m.scrollTop=m.scrollHeight;
    }).catch(function(x){if(!quiet){var box=$('thread');box.textContent='';box.appendChild(el('p','empty',x.message))}});
  }
  function renderThread(t){
    var box=$('thread');box.textContent='';
    var h=el('div','th');
    var back=el('button','btn ghost back','رجوع');back.type='button';
    back.onclick=function(){current=null;seq++;$('app').classList.remove('open');renderList()};
    h.appendChild(back);h.appendChild(avatar(t,true));
    var who=el('div','who');who.appendChild(el('h2',null,t.name||t.phone));
    var sub=el('small',null,(BRAND[t.brand]||{}).label||'');
    if(t.phone&&t.name){sub.appendChild(document.createTextNode(' · '));sub.appendChild(el('span','ph',t.phone))}
    who.appendChild(sub);h.appendChild(who);
    if(t.business){
      var tog=el('button','btn'+(t.paused?'':' ghost'),t.paused?'خلّي البوت يكمل':'وقّف البوت');tog.type='button';
      tog.onclick=function(){tog.disabled=true;call(t.paused?'resume':'pause',{id:t.id}).then(refresh).catch(function(x){alert(x.message);tog.disabled=false})};
      h.appendChild(tog);
    }
    box.appendChild(h);

    var m=el('div','msgs');m.id='msgs';var day='';
    t.messages.forEach(function(x){
      var k=dayKey(x.at);
      if(k!==day){day=k;m.appendChild(el('div','dayline',dayName(x.at)))}
      var b=el('div','m'+(x.dir==='in'?'':' out'));
      if(x.sender)b.appendChild(el('span','sender',x.sender));
      if(isMedia(x.text))b.appendChild(el('span','media',clean(x.text,x.type)));
      else b.appendChild(document.createTextNode(clean(x.text,x.type)));
      if(/^https:\/\//.test(x.file||'')){var a=el('a',null,'افتح الملف');a.href=x.file;a.target='_blank';a.rel='noopener noreferrer';b.appendChild(document.createElement('br'));b.appendChild(a)}
      var manual=x.dir==='out'&&String(x.text||'').indexOf('[يدوي]')>-1;
      b.appendChild(el('small',null,(t.business&&x.dir==='out'?(manual?'رد يدوي · ':'البوت · '):'')+clock(x.at)));
      m.appendChild(b);
    });
    box.appendChild(m);

    if(t.canReply){
      var c=el('form','compose'),row=el('div','row'),ta=el('textarea');ta.id='reply';ta.maxLength=2000;ta.placeholder='اكتب ردك';ta.setAttribute('aria-label','ردك');
      var send=el('button','btn','ابعت');send.type='submit';
      row.appendChild(ta);row.appendChild(send);c.appendChild(row);
      c.appendChild(el('p','hint',t.paused?'البوت موقوف، والرد هيتبعت من الرقم التجاري.':'لما تبعت رد، البوت هيقف للعميل ده.'));
      c.addEventListener('submit',function(e){
        e.preventDefault();var text=ta.value.trim();if(!text)return;send.disabled=true;
        call('reply',{id:t.id,text:text}).then(function(){ta.value='';setTimeout(refresh,2500)}).catch(function(x){alert(x.message)}).then(function(){send.disabled=false});
      });
      box.appendChild(c);
    }else if(t.business){
      box.appendChild(el('div','compose')).appendChild(el('p','hint','عدّت 24 ساعة من آخر رسالة للعميل، فكلّمه مباشرة من الموبايل.'));
    }
  }

  go('home');
  sb.auth.getSession().then(function(r){if(r.data.session)enter()});
})();
</script>
</body>
</html>
