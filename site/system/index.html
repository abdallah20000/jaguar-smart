let sb = null;
if (!DEMO) { try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; } }
async function rpc(name, args) {

  if (!sb) throw new Error('تعذّر تحميل مكتبة الاتصال — اتأكد من الإنترنت');
  const { data, error, status } = await sb.rpc(name, args || {});

  }
  if (a === 'closesheet') { S.sheet = null; return render(); }
  if (a === 'tab') { S.tab = t.dataset.t; S.count = null; render(); return void act(() => loadInv(S.tab)); }
  if (a === 'kind') { S.moveKind = t.dataset.k; return render(); }
  if (a === 'whform') { S.sheet = { kind: 'wh', rec: S.wh.find((w) => w.id === t.dataset.id) || null }; return render(); }
  if (a === 'itemform') { S.sheet = { kind: 'item', rec: S.items.find((x) => x.id === t.dataset.id) || null }; return render(); }
  if (a === 'legacy') return void act(async () => { await rpc('sys_import_legacy', { p_company: S.co }); await loadInv(S.tab); }, 'تم الاستيراد');
  if (a === 'toggleadmin') { const p = S.people[+t.dataset.i]; return void act(async () => { await rpc('sys_set_admin', { p_email: p.email, p_on: !p.is_admin }); await loadAdmin(); }, 'اتحدّث'); }
  if (a === 'countlist') { S.count = null; return void act(() => loadInv('count')); }
  if (a === 'countopen') return void act(async () => { S.count = await rpc('sys_count_get', { p_count: t.dataset.id }); });
  if (a === 'post') { if (!confirm('ترحيل الجرد هيعدّل الأرصدة. متأكد؟')) return; return void act(async () => { await rpc('sys_count_post', { p_count: S.count.id }); S.count = await rpc('sys_count_get', { p_count: S.count.id }); await loadInv('count'); }, 'اترحّل الجرد'); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target.closest('[data-chg]'); if (!t) return; const k = t.dataset.chg;
  if (k === 'demouser') { const e = $('lgE'); if (e) e.value = t.value; return; }
  if (k === 'co') { setCo(t.value); if (S.route === 'inventory' && !can('inventory', 'view')) { location.hash = '#home'; return; } render(); if (S.route === 'inventory') act(() => loadInv(S.tab)); if (S.route === 'admin') act(loadAdmin); return; }
  if (k === 'whfilter') { S.whFilter = t.value; return void act(() => loadInv('items')); }
  if (k === 'perm') { const p = S.people[+t.dataset.i], c = t.dataset.c, m = t.dataset.m, lv = t.value || null; return void act(async () => { await rpc('sys_set_permission', { p_company: c, p_email: p.email, p_module: m, p_level: lv }); (p.perms[c] = p.perms[c] || {})[m] = lv; if (!lv) delete p.perms[c][m]; await loadAdmin(); if (!S.people.some((x) => x.email === p.email)) S.people.unshift(p); }, 'اتحفظت الصلاحية'); }
  if (k === 'cnt') {
    const l = S.count.lines[+t.dataset.i], val = t.value === '' ? null : Number(t.value); const prev = l.counted;
    if (val !== null && !isFinite(val)) { t.value = prev == null ? '' : prev; return; }
    rpc('sys_count_set', { p_count: S.count.id, p_item: l.item_id, p_counted: val }).then(() => { l.counted = val; const d = $('diff' + t.dataset.i); if (d) d.textContent = val == null ? '—' : num(val - l.expected); }).catch((e) => { toast(e.message); t.value = prev == null ? '' : prev; });
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/system/sw.js', { scope: '/system/' }).catch(() => {});
boot();
</script>
