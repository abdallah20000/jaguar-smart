<style>
:root { --bg:#0f1216; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1); --line:rgba(255,255,255,.12); --fg:#eef1f4; --muted:#9aa4ae; --accent:#ff6a2b; --err:#ff8a7a; --ok:#5fd39a; --warn:#ffc35a; --info:#7fb6ff }

<script>
'use strict';
/* ============================ «نظام الشركة» — one-file app ============================
   Real host (jaguarsmart.com / www): Supabase RPCs sys_* (migration 114). The server is the real guard;
   hiding buttons below is only convenience. Any other host: DEMO with in-memory fake data, no network. */
const SUPABASE_URL = "https://snrsfpprlynixotjipmo.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q9zcnd6bo1cM4VDRysyjbA_XBr6lhds";
const REAL_HOSTS = ['jaguarsmart.com', 'www.jaguarsmart.com'];
const DEMO = !REAL_HOSTS.includes(location.hostname.toLowerCase());
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function num(n) { n = Number(n); return isFinite(n) ? String(Math.round(n * 1000) / 1000) : '0'; }
function fdate(s) { try { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('en-GB', { dateStyle: 'short', timeStyle: 'short' }); } catch (e) { return ''; } }

const COMPANY_NAMES = { 'tuya-suez': 'تويا السويس', 'aix': 'AIX', 'jaguar': 'جاجوار' };
const cname = (c) => COMPANY_NAMES[c] || c;
const MODULES = [
  { k: 'inventory', n: 'المخزون', live: true }, { k: 'users', n: 'المستخدمين والصلاحيات', live: true, adminOnly: true },
  { k: 'sales', n: 'المبيعات' }, { k: 'purchasing', n: 'المشتريات' }, { k: 'accounts', n: 'الحسابات' },
  { k: 'projects', n: 'المشاريع' }, { k: 'hr', n: 'الموارد البشرية' }, { k: 'reports', n: 'التقارير' }
];
const MOD_NAME = Object.fromEntries(MODULES.map((m) => [m.k, m.n]));
const LEVELS = [['', '—'], ['view', 'يشوف'], ['edit', 'يعدّل'], ['approve', 'يوافق']];
const RANK = { view: 1, edit: 2, approve: 3 };
const KIND_NAME = { in: 'وارد', out: 'صادر', adjust: 'تسوية جرد', transfer_out: 'تحويل (خارج)', transfer_in: 'تحويل (داخل)' };
const ICONS = {
  inventory: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.7 3.2 2.4 3.5 5.2"/></svg>',
  other: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12h6"/></svg>'
};

/* ---------------------------------- fake backend (demo only) ---------------------------------- */
const Fake = (() => {
  let seq = 0; const id = () => 'd' + (++seq).toString(16).padStart(8, '0') + '-0000-4000-8000-000000000000';
  const ME = 'demo@example.com';
  const db = { admins: [ME, 'omar@example.com'], perms: [], audit: [], wh: [], items: [], stock: {}, moves: [], counts: [], extra: ['ahmed@example.com', 'mona@example.com'] };
  const now = () => new Date().toISOString();
  const aud = (action, company, target, details) => db.audit.unshift({ id: id(), at: now(), actor: ME, action, company, target, details: details || {} });
  db.perms.push({ company: 'tuya-suez', email: 'ahmed@example.com', module: 'inventory', level: 'edit' }, { company: 'tuya-suez', email: 'mona@example.com', module: 'inventory', level: 'view' }, { company: 'aix', email: 'mona@example.com', module: 'sales', level: 'view' });
  function addWh(company, name, location) { const w = { id: id(), company, name, location, active: true, created_at: now() }; db.wh.push(w); return w; }
  function addItem(company, code, name, category, unit, min) { const it = { id: id(), company, code, name, category, unit, min_qty: min, product_id: null, active: true }; db.items.push(it); return it; }
  function put(it, w, q) { db.stock[it.id + '|' + w.id] = q; }
  const w1 = addWh('tuya-suez', 'المخزن الرئيسي', 'السويس'), w2 = addWh('tuya-suez', 'مخزن العمليات', 'سيارة الفني');
  const w3 = addWh('aix', 'مخزن AIX', 'القاهرة');
  [['SW-01', 'سويتش زيجبي ٣ زر', 'سويتشات', 'قطعة', 10, 24, 3], ['HB-01', 'هاب زيجبي', 'هابات', 'قطعة', 5, 4, 2], ['CAM-01', 'كاميرا واي فاي', 'كاميرات', 'قطعة', 6, 9, 0], ['CB-01', 'كابل شبكة', 'كابلات', 'متر', 100, 350, 0], ['SN-01', 'حساس حركة', 'حساسات', 'قطعة', 8, 15, 5]].forEach((r) => { const it = addItem('tuya-suez', r[0], r[1], r[2], r[3], r[4]); put(it, w1, r[5]); put(it, w2, r[6]); });
  [['AX-01', 'جهاز تحكم مركزي', 'تحكم', 'قطعة', 3, 2], ['AX-02', 'شاشة لمس', 'شاشات', 'قطعة', 2, 6]].forEach((r) => { const it = addItem('aix', r[0], r[1], r[2], r[3], r[4]); put(it, w3, r[5]); });
  aud('seed', null, null, { note: 'بيانات وهمية' });

  const isAdmin = (e) => db.admins.includes(e);
  const gone = (m) => { throw new Error(m); };
  const total = (it) => db.wh.filter((w) => w.company === it.company).reduce((s, w) => s + (db.stock[it.id + '|' + w.id] || 0), 0);
  const q = (it, w) => db.stock[it.id + '|' + w] || 0;
  const wh = (i) => db.wh.find((w) => w.id === i) || gone('المخزن غير موجود');
  const it_ = (i) => db.items.find((x) => x.id === i) || gone('الصنف غير موجود');
  function addMove(company, it, w, kind, qty, before, after, ref, note) { db.moves.unshift({ id: id(), at: now(), company, item_id: it.id, item_name: it.name, warehouse_id: w, warehouse_name: wh(w).name, kind, qty, qty_before: before, qty_after: after, ref: ref || null, note: note || null, by_email: ME }); }
  const fns = {
    sys_me() { const companies = ['tuya-suez', 'aix']; const perms = {}; return { email: ME, is_admin: true, companies, perms }; },
    sys_is_admin() { return true; },
    sys_can() { return true; },
    sys_people() {
      const emails = new Set([...db.admins, ...db.extra, ...db.perms.map((p) => p.email)]);
      return [...emails].map((email) => { const perms = {}; db.perms.filter((p) => p.email === email).forEach((p) => { (perms[p.company] = perms[p.company] || {})[p.module] = p.level; }); return { email, is_admin: isAdmin(email), perms }; });
    },
    sys_set_admin(a) {
      const e = String(a.p_email || '').trim().toLowerCase(); if (!e) gone('اكتب الإيميل');
      if (!a.p_on) { if (e === ME) gone('مينفعش تشيل نفسك'); if (db.admins.length <= 1) gone('مينفعش تشيل آخر أدمن'); db.admins = db.admins.filter((x) => x !== e); } else if (!db.admins.includes(e)) db.admins.push(e);
      aud(a.p_on ? 'admin_on' : 'admin_off', null, e); return null;
    },
    sys_set_permission(a) {
      const e = String(a.p_email).toLowerCase(); db.perms = db.perms.filter((p) => !(p.company === a.p_company && p.email === e && p.module === a.p_module));
      if (a.p_level) db.perms.push({ company: a.p_company, email: e, module: a.p_module, level: a.p_level });
      aud('perm', a.p_company, e, { module: a.p_module, level: a.p_level }); return null;
    },
    sys_audit_list(a) { return db.audit.slice(0, a.p_limit || 100); },
    sys_warehouses_list(a) { return db.wh.filter((w) => w.company === a.p_company); },
    sys_warehouse_save(a) {
      if (!String(a.p_name || '').trim()) gone('اكتب اسم المخزن');
      let w = a.p_id ? wh(a.p_id) : null; if (!w) { w = { id: id(), company: a.p_company, created_at: now() }; db.wh.push(w); }
      w.name = a.p_name; w.location = a.p_location || null; w.active = a.p_active !== false; aud('warehouse_save', a.p_company, w.name); return w.id;
    },
    sys_items_list(a) {
      return db.items.filter((x) => x.company === a.p_company && x.active).map((x) => { const t = total(x); return { id: x.id, code: x.code, name: x.name, category: x.category, unit: x.unit, min_qty: x.min_qty, total_qty: t, wh_qty: a.p_warehouse ? q(x, a.p_warehouse) : null, low: t <= x.min_qty }; });
    },
    sys_item_save(a) {
      if (!String(a.p_name || '').trim()) gone('اكتب اسم الصنف');
      if (a.p_code && db.items.some((x) => x.company === a.p_company && x.code === a.p_code && x.id !== a.p_id)) gone('الكود ده مستخدم قبل كده');
      let x = a.p_id ? it_(a.p_id) : null; if (!x) { x = { id: id(), company: a.p_company, active: true, product_id: null }; db.items.push(x); }
      Object.assign(x, { code: a.p_code || null, name: a.p_name, category: a.p_category || null, unit: a.p_unit || 'قطعة', min_qty: Number(a.p_min_qty) || 0 }); aud('item_save', a.p_company, x.name); return x.id;
    },
    sys_move(a) {
      const it = it_(a.p_item), qty = Number(a.p_qty); if (!(qty > 0)) gone('الكمية لازم تكون أكبر من صفر');
      const b = q(it, a.p_warehouse), aft = a.p_kind === 'in' ? b + qty : b - qty; if (aft < 0) gone('الرصيد مش كفاية (الموجود ' + num(b) + ')');
      db.stock[it.id + '|' + a.p_warehouse] = aft; addMove(a.p_company, it, a.p_warehouse, a.p_kind, qty, b, aft, a.p_ref, a.p_note); aud('move', a.p_company, it.name, { kind: a.p_kind, qty }); return { qty_after: aft };
    },
    sys_transfer(a) {
      const it = it_(a.p_item), qty = Number(a.p_qty); if (!(qty > 0)) gone('الكمية لازم تكون أكبر من صفر'); if (a.p_from === a.p_to) gone('اختار مخزنين مختلفين');
      const b = q(it, a.p_from); if (b - qty < 0) gone('الرصيد مش كفاية (الموجود ' + num(b) + ')'); const b2 = q(it, a.p_to);
      db.stock[it.id + '|' + a.p_from] = b - qty; db.stock[it.id + '|' + a.p_to] = b2 + qty;
      addMove(a.p_company, it, a.p_from, 'transfer_out', qty, b, b - qty, null, a.p_note); addMove(a.p_company, it, a.p_to, 'transfer_in', qty, b2, b2 + qty, null, a.p_note); aud('transfer', a.p_company, it.name, { qty }); return null;
    },
    sys_moves_list(a) { return db.moves.filter((m) => m.company === a.p_company && (!a.p_item || m.item_id === a.p_item)).slice(0, a.p_limit || 200); },
    sys_low_stock(a) { return fns.sys_items_list({ p_company: a.p_company }).filter((x) => x.low); },
    sys_count_start(a) {
      const w = wh(a.p_warehouse); const c = { id: id(), company: a.p_company, warehouse_id: w.id, status: 'draft', note: a.p_note || null, created_by: ME, created_at: now(), lines: [] };
      db.items.filter((x) => x.company === a.p_company && x.active).forEach((x) => c.lines.push({ item_id: x.id, expected: q(x, w.id), counted: null })); db.counts.unshift(c); aud('count_start', a.p_company, w.name); return c.id;
    },
    sys_count_set(a) { const c = db.counts.find((x) => x.id === a.p_count) || gone('الجرد غير موجود'); if (c.status !== 'draft') gone('الجرد مقفول'); const l = c.lines.find((x) => x.item_id === a.p_item); if (!l) gone('الصنف مش في الجرد'); l.counted = a.p_counted === null || a.p_counted === '' ? null : Number(a.p_counted); return null; },
    sys_count_get(a) {
      const c = db.counts.find((x) => x.id === a.p_count) || gone('الجرد غير موجود');
      return { id: c.id, company: c.company, warehouse_id: c.warehouse_id, warehouse_name: wh(c.warehouse_id).name, status: c.status, note: c.note, created_by: c.created_by, created_at: c.created_at, posted_at: c.posted_at || null,
        lines: c.lines.map((l) => ({ item_id: l.item_id, name: it_(l.item_id).name, code: it_(l.item_id).code, expected: l.expected, counted: l.counted, diff: l.counted == null ? null : l.counted - l.expected })) };
    },
    sys_count_post(a) {
      const c = db.counts.find((x) => x.id === a.p_count) || gone('الجرد غير موجود'); if (c.status !== 'draft') gone('الجرد مقفول');
      c.lines.forEach((l) => { if (l.counted != null && l.counted !== l.expected) { const x = it_(l.item_id); db.stock[x.id + '|' + c.warehouse_id] = l.counted; addMove(c.company, x, c.warehouse_id, 'adjust', l.counted - l.expected, l.expected, l.counted, 'جرد', null); } });
      c.status = 'posted'; c.posted_at = now(); aud('count_post', c.company, wh(c.warehouse_id).name); return null;
    },
    sys_counts_list(a) { return db.counts.filter((c) => c.company === a.p_company).map((c) => ({ id: c.id, warehouse_id: c.warehouse_id, warehouse_name: wh(c.warehouse_id).name, status: c.status, note: c.note, created_by: c.created_by, created_at: c.created_at, posted_at: c.posted_at || null })); },
    sys_import_legacy() { gone('الاستيراد مش متاح في النسخة التجريبية'); }
  };
  return { call(name, args) { const f = fns[name]; if (!f) throw new Error('RPC مش موجود: ' + name); return Promise.resolve(JSON.parse(JSON.stringify(f(args || {}) ?? null))); } };

let sb = null;
if (!DEMO) { try { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { sb = null; } }
async function rpc(name, args) {
  if (DEMO) return Fake.call(name, args);
  if (!sb) throw new Error('تعذّر تحميل مكتبة الاتصال — اتأكد من الإنترنت');
  const { data, error } = await sb.rpc(name, args || {});
  if (error) { const m = String(error.message || ''); throw new Error(error.code === 'PGRST202' || /Could not find the function/i.test(m) ? 'النظام لسه متفعّلش (الميجريشن 114 لم تُشغّل)' : m || 'خطأ'); }
  return data;
}

async function loadMe() {
  const me = await rpc('sys_me');
  if (!me || !me.email) throw new Error('الحساب ده مش متسجّل في النظام');
  me.perms = me.perms || {}; me.companies = Array.isArray(me.companies) ? me.companies.slice() : [];
  if (me.is_admin) ['tuya-suez', 'aix'].forEach((c) => { if (!me.companies.includes(c)) me.companies.push(c); });
  S.me = me;
  if (!S.co || !me.companies.includes(S.co)) S.co = me.companies[0] || null;
  setCo(S.co);
}
function setCo(c) { S.co = c; try { if (c) localStorage.setItem('sys-co', c); } catch (e) {} S.wh = []; S.items = []; S.moves = []; S.counts = []; S.low = []; S.count = null; }
async function boot() {
  if (DEMO) $('banner').classList.remove('hidden');
  let signedIn = DEMO;
  if (!DEMO && sb) { try { const { data } = await sb.auth.getSession(); signedIn = !!(data && data.session); } catch (e) { signedIn = false; } }
  S.signed = signedIn;
  if (signedIn) { try { await loadMe(); } catch (e) { S.loginMsg = e.message; S.signed = false; S.me = null; } }
  if (!location.hash) location.hash = S.me ? '#home' : '#login';
  route();
}
async function route() {
  const r = (location.hash || '#login').slice(1).split('?')[0];
  S.route = ['login', 'home', 'admin', 'inventory'].includes(r) ? r : 'home';
  if (!S.me && S.route !== 'login') { location.hash = '#login'; return; }
  if (S.me && S.route === 'login') { location.hash = '#home'; return; }
  if (S.route === 'admin' && !(S.me && S.me.is_admin)) { location.hash = '#home'; return; }
  if (S.route === 'inventory' && !can('inventory', 'view')) { location.hash = '#home'; return; }
  S.sheet = null; render();
  if (S.route === 'admin') act(loadAdmin);
  if (S.route === 'inventory') act(() => loadInv(S.tab));
}
window.addEventListener('hashchange', route);

async function doLogin(email, pass) {
  if (!email || (!DEMO && !pass)) { S.loginMsg = 'اكتب الإيميل والباسورد'; return render(); }
  S.loginMsg = ''; S.busy = true; render();
  try {
    if (!DEMO) { const { error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw new Error('الإيميل أو الباسورد غلط'); }
    await loadMe(); S.signed = true;
    S.busy = false; if (location.hash === '#home') route(); else location.hash = '#home';
  } catch (e) { S.loginMsg = e.message; S.busy = false; if (!DEMO && sb) { try { await sb.auth.signOut(); } catch (x) {} } S.me = null; render(); }
}
async function doLogout() { if (!DEMO && sb) { try { await sb.auth.signOut(); } catch (e) {} } S.me = null; S.signed = false; S.loginMsg = ''; location.hash = '#login'; route(); }

async function loadAdmin() {

  S.people = (p || []).map((x) => ({ email: x.email, is_admin: !!x.is_admin, perms: normPerms(x.perms) })).sort((a, b) => a.email.localeCompare(b.email));

}
function normPerms(p) {
  if (!p) return {}; if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return {}; } }
  if (Array.isArray(p)) { const o = {}; p.forEach((r) => { if (r && r.company) (o[r.company] = o[r.company] || {})[r.module] = r.level; }); return o; }
  return p;
}
async function loadInv(tab) {
  const c = S.co; if (!c) return;

  if (tab === 'items' || tab === 'move') jobs.push(rpc('sys_items_list', { p_company: c, p_warehouse: tab === 'items' && S.whFilter ? S.whFilter : null }).then((d) => { S.items = d || []; }));

}

  const k = f.dataset.form, v = fd(f), c = S.co;
  if (k === 'login') return void doLogin(String(v.email || f.querySelector('#lgE').value).trim().toLowerCase(), f.querySelector('#lgP').value);
  if (k === 'addperson') { const e = f.querySelector('#npE').value.trim().toLowerCase(); if (!e) return; if (!S.people.some((p) => p.email === e)) S.people.unshift({ email: e, is_admin: false, perms: {} }); render(); return toast('اضبط صلاحياته من تحت'); }
  if (k === 'whsave') return void act(async () => { await rpc('sys_warehouse_save', { p_company: c, p_id: S.sheet.rec && S.sheet.rec.id || null, p_name: v.name.trim(), p_location: v.location.trim() || null, p_active: !!v.active }); S.sheet = null; await loadInv(S.tab); }, 'اتحفظ');
  if (k === 'itemsave') return void act(async () => { await rpc('sys_item_save', { p_company: c, p_id: S.sheet.rec && S.sheet.rec.id || null, p_code: v.code.trim() || null, p_name: v.name.trim(), p_category: v.category.trim() || null, p_unit: v.unit.trim() || 'قطعة', p_min_qty: Number(v.min) || 0 }); S.sheet = null; await loadInv(S.tab); }, 'اتحفظ');
  if (k === 'move') return void act(async () => {
    const q = Number(v.qty);
    if (S.moveKind === 'transfer') await rpc('sys_transfer', { p_company: c, p_item: v.item, p_from: v.wh, p_to: v.to, p_qty: q, p_note: v.note.trim() || null });
    else await rpc('sys_move', { p_company: c, p_item: v.item, p_warehouse: v.wh, p_kind: S.moveKind, p_qty: q, p_ref: (v.ref || '').trim() || null, p_note: v.note.trim() || null });
    await loadInv('move');
  }, 'اتسجّلت الحركة');
  if (k === 'countstart') return void act(async () => { const id = await rpc('sys_count_start', { p_company: c, p_warehouse: v.wh, p_note: v.note.trim() || null }); S.count = await rpc('sys_count_get', { p_count: id }); }, 'بدأ الجرد');
});
document.addEventListener('click', (ev) => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  if (t.dataset.act === 'closesheet' && ev.target.closest('[data-stop]') && !ev.target.closest('button[data-act="closesheet"]')) return;
  const a = t.dataset.act;
  if (a === 'forgot') { S.forgot = true; return render(); }
  if (a === 'go') { location.hash = '#' + t.dataset.to; return; }
  if (a === 'home') { location.hash = '#home'; return; }
  if (a === 'logout') return void doLogout();
  if (a === 'closesheet') { S.sheet = null; return render(); }
  if (a === 'tab') { S.tab = t.dataset.t; S.count = null; render(); return void act(() => loadInv(S.tab)); }
  if (a === 'kind') { S.moveKind = t.dataset.k; return render(); }
  if (a === 'whform') { S.sheet = { kind: 'wh', rec: S.wh.find((w) => w.id === t.dataset.id) || null }; return render(); }
  if (a === 'itemform') { S.sheet = { kind: 'item', rec: S.items.find((x) => x.id === t.dataset.id) || null }; return render(); }
  if (a === 'legacy') return void act(async () => { await rpc('sys_import_legacy', { p_company: S.co }); await loadInv(S.tab); }, 'تم الاستيراد');
  if (a === 'toggleadmin') { const p = S.people[+t.dataset.i]; return void act(async () => { await rpc('sys_set_admin', { p_email: p.email, p_on: !p.is_admin }); await loadAdmin(); }, 'اتحدّث'); }
  if (a === 'countlist') { S.count = null; return void act(() => loadInv('count')); }
  if (a === 'countopen') return void act(async () => { S.count = await rpc('sys_count_get', { p_count: t.dataset.id }); });
  if (a === 'post') { if (!confirm('ترحيل الجرد هيعدّل الأرصدة. متأكد؟')) return; return void act(async () => { await rpc('sys_count_post', { p_count: S.count.id }); S.count = await rpc('sys_count_get', { p_count: S.count.id }); await loadInv('count'); }, 'اترحّل الجرد'); }
});
document.addEventListener('change', (ev) => {
  const t = ev.target.closest('[data-chg]'); if (!t) return; const k = t.dataset.chg;
  if (k === 'co') { setCo(t.value); render(); if (S.route === 'inventory') act(() => loadInv(S.tab)); if (S.route === 'admin') act(loadAdmin); return; }
  if (k === 'whfilter') { S.whFilter = t.value; return void act(() => loadInv('items')); }
  if (k === 'perm') { const p = S.people[+t.dataset.i], c = t.dataset.c, m = t.dataset.m, lv = t.value || null; return void act(async () => { await rpc('sys_set_permission', { p_company: c, p_email: p.email, p_module: m, p_level: lv }); (p.perms[c] = p.perms[c] || {})[m] = lv; if (!lv) delete p.perms[c][m]; await loadAdmin(); if (!S.people.some((x) => x.email === p.email)) S.people.unshift(p); }, 'اتحفظت الصلاحية'); }
  if (k === 'cnt') {
    const l = S.count.lines[+t.dataset.i], val = t.value === '' ? null : Number(t.value); const prev = l.counted;
    if (val !== null && !isFinite(val)) { t.value = prev == null ? '' : prev; return; }
    rpc('sys_count_set', { p_count: S.count.id, p_item: l.item_id, p_counted: val }).then(() => { l.counted = val; const d = $('diff' + t.dataset.i); if (d) d.textContent = val == null ? '—' : num(val - l.expected); }).catch((e) => { toast(e.message); t.value = prev == null ? '' : prev; });
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/system/sw.js', { scope: '/system/' }).catch(() => {});
boot();
</script>
