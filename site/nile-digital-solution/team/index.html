<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة فريق Nile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Cairo:wght@400;600;700;800&family=Montserrat:wght@500;600&display=swap">
<style>
/* Same Nile tokens as the public site. Login first, then a two-pane inbox with a sales tab. */
:root{
  --night:#0b182e; --deep:#10233f; --panel:#142b4d; --panel-2:#1a3458;
  --gold:#c9a35a; --gold-soft:#e2c48a; --gold-dim:rgba(201,163,90,.14);
  --cream:#f4ecdc; --mist:#aeb8ca; --line:rgba(201,163,90,.32);
  --ok:#5fd39a; --bad:#ff8f84;
  --body:'Cairo',Tahoma,sans-serif; --display:'Cormorant Garamond',Georgia,serif; --latin:'Montserrat',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--body);font-size:16px;line-height:1.7}
button,input,textarea{font-family:var(--body);font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--gold);color:var(--night);font-weight:800;padding:10px 18px;border:0;cursor:pointer;border-radius:2px}
.btn:hover{background:var(--gold-soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--gold-dim)}
.btn.go{background:var(--ok);color:#06301a}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.conv:focus-visible,.tab:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px}
input,textarea,select{width:100%;background:var(--night);border:1px solid var(--line);color:var(--cream);padding:11px 13px;border-radius:2px}
label{display:block;font-size:14px;color:var(--mist);margin-bottom:4px}
[hidden]{display:none!important}
.logo{font-family:var(--display);font-size:24px;letter-spacing:.2em;direction:ltr}
.logo small{font-family:var(--latin);font-size:9px;letter-spacing:.3em;color:var(--gold);display:block;line-height:1}
/* login */
.gate{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.gate form{width:100%;max-width:400px;background:var(--deep);border:1px solid var(--line);padding:28px;display:grid;gap:14px}
.gate h1{margin:0;font-size:24px;font-weight:800}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:0}
.link{background:none;border:0;color:var(--gold-soft);cursor:pointer;padding:0;text-align:start;font-size:14px}
/* app */
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--deep);flex-wrap:wrap}
.top .who{color:var(--mist);font-size:14px;display:flex;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stats div{background:var(--night);padding:10px 14px;min-width:0}
.stats b{display:block;font-size:22px;color:var(--gold-soft);font-variant-numeric:tabular-nums;line-height:1.3}
.stats span{font-size:13px;color:var(--mist)}
.tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--mist);padding:6px 14px;cursor:pointer;font-weight:700}
.tab[aria-selected="true"]{color:var(--gold-soft);border-color:var(--gold)}
.body{flex:1;min-height:0;display:flex}
.list{width:340px;flex:none;border-inline-end:1px solid var(--line);overflow:auto}
.conv{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--cream);padding:12px 16px;cursor:pointer}
.conv:hover{background:var(--gold-dim)}
.conv[aria-current="true"]{background:var(--panel)}
.conv .row1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.conv b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv time{font-size:12px;color:var(--mist);white-space:nowrap}
.conv p{margin:2px 0 0;color:var(--mist);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:999px;border:1px solid var(--line);color:var(--mist)}
.pill.off{color:var(--bad);border-color:rgba(255,143,132,.5)}
.pill.on{color:var(--ok);border-color:rgba(95,211,154,.45)}
.thread{flex:1;min-width:0;display:flex;flex-direction:column}
.thead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.thead h2{margin:0;font-size:18px;font-weight:800}
.thead .ph{direction:ltr;display:inline-block;font-family:var(--latin);font-size:13px;color:var(--mist)}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:min(72%,560px);padding:8px 12px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.m small{display:block;font-size:12px;color:var(--mist);margin-top:2px}
.m.in{align-self:flex-start;background:var(--panel)}
.m.out{align-self:flex-end;background:var(--panel-2);border:1px solid var(--line)}
.m.manual{border-color:var(--gold)}
.compose{border-top:1px solid var(--line);padding:10px 16px;display:grid;gap:8px}
.compose textarea{min-height:64px;resize:vertical}
.compose .acts{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mist);margin:0}
.empty{margin:auto;color:var(--mist);text-align:center;padding:32px 16px}
.sales{flex:1;overflow:auto;padding:16px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:13px;color:var(--mist);text-align:start;font-weight:600}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td .ph{direction:ltr;display:inline-block;font-family:var(--latin);font-size:13px}
.add{display:grid;grid-template-columns:1fr 1.3fr 140px auto;gap:10px;align-items:end;margin-bottom:8px}
.code{border:1px solid var(--gold);background:var(--gold-dim);padding:12px 14px;margin-bottom:12px}
.code b{direction:ltr;display:inline-block;font-family:var(--latin);font-size:18px;letter-spacing:.08em;user-select:all}
.rowacts{display:flex;gap:6px;flex-wrap:wrap}
.rowacts .btn{padding:4px 10px;font-size:14px}
.back{display:none}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .add{grid-template-columns:1fr}
  .list{width:100%;border:0}
  .body.open .list{display:none}
  .body:not(.open) .thread{display:none}
  .back{display:inline-flex}
  .m{max-width:88%}
  .sales thead{display:none}
  .sales tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  .sales td{display:block;border:0;padding:2px 0}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="auth" novalidate>
    <div class="logo">NILE<small>DIGITAL SOLUTIONS</small></div>
    <h1 id="authTitle">دخول الفريق</h1>
    <div><label for="email">الإيميل</label><input id="email" type="email" autocomplete="username" dir="ltr" required></div>
    <div id="codeBox" hidden><label for="code">كود التفعيل</label><input id="code" autocomplete="one-time-code" dir="ltr"></div>
    <div><label for="pw" id="pwLabel">كلمة السر</label><input id="pw" type="password" autocomplete="current-password" dir="ltr" required></div>
    <p class="err" id="authErr" aria-live="polite"></p>
    <button class="btn" type="submit" id="authBtn">دخول</button>
    <button class="link" type="button" id="toggle">أول مرة تدخل؟ فعّل حسابك</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="logo">NILE<small>DIGITAL SOLUTIONS</small></div>
    <div class="who"><span id="who"></span><button class="btn ghost" type="button" id="logout">خروج</button></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-v="chats">المحادثات</button>
    <button class="tab" role="tab" aria-selected="false" data-v="sales">المبيعات</button>
    <button class="tab" role="tab" aria-selected="false" data-v="team" id="teamTab" hidden>الفريق</button>
  </div>
  <main class="body" id="chats">
    <nav class="list" id="list" aria-label="المحادثات"></nav>
    <section class="thread" id="thread"><p class="empty">اختار محادثة من القايمة</p></section>
  </main>
  <main class="sales" id="sales" hidden></main>
  <main class="sales" id="team" hidden>
    <form class="add" id="addMember" novalidate>
      <div><label for="mName">الاسم</label><input id="mName" autocomplete="off"></div>
      <div><label for="mEmail">الإيميل</label><input id="mEmail" type="email" dir="ltr" autocomplete="off"></div>
      <div><label for="mRole">الصلاحية</label><select id="mRole"><option value="member">موظف</option><option value="admin">مدير</option></select></div>
      <button class="btn" type="submit" id="mSend">ضيف</button>
    </form>
    <p class="err" id="teamErr" aria-live="polite"></p>
    <div class="code" id="teamCode" hidden aria-live="polite"></div>
    <div id="members"></div>
  </main>
</div>

<script>
(function(){
  var API='https://n8n-hesb.srv2112249.hstgr.cloud/webhook/nile-team';
  var KEY='nile_team_session';
  var $=function(id){return document.getElementById(id)};
  var token='',current=null,setupMode=false,timer=null,seq=0;

  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(x){return null}}
  function save(v){try{v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY)}catch(x){}}
  function when(d){
    var t=new Date(d);
    if(isNaN(t))return '';
    var same=t.toDateString()===new Date().toDateString();
    return t.toLocaleString('ar-EG',same?{hour:'numeric',minute:'2-digit'}:{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
  }
  function call(body){
    var p=new URLSearchParams(body);
    return fetch(API,{method:'POST',body:p}).then(function(r){
      return r.json().catch(function(){return {}}).then(function(j){
        if(r.status===401&&token){signOut();}
        if(!r.ok)throw new Error(j.error||'حصلت مشكلة. جرّب تاني');
        return j;
      });
    });
  }
  function api(action,extra){var b={action:action,token:token};for(var k in extra)b[k]=extra[k];return call(b)}

  /* auth */
  function setMode(setup){
    setupMode=setup;
    $('codeBox').hidden=!setup;
    $('authTitle').textContent=setup?'تفعيل الحساب':'دخول الفريق';
    $('pwLabel').textContent=setup?'اختار كلمة سر (8 حروف على الأقل)':'كلمة السر';
    $('authBtn').textContent=setup?'فعّل الحساب':'دخول';
    $('toggle').textContent=setup?'عندي حساب مفعّل':'أول مرة تدخل؟ فعّل حسابك';
    $('pw').autocomplete=setup?'new-password':'current-password';
    $('authErr').textContent='';
  }
  $('toggle').onclick=function(){setMode(!setupMode)};
  $('auth').addEventListener('submit',function(e){
    e.preventDefault();
    var email=$('email').value.trim(),pw=$('pw').value,err=$('authErr'),btn=$('authBtn');
    if(!email||!pw){err.textContent='اكتب الإيميل وكلمة السر';return}
    err.textContent='';btn.disabled=true;
    var first=setupMode?call({action:'setup',email:email,password:pw,code:$('code').value}):Promise.resolve();
    first.then(function(){return call({action:'login',email:email,password:pw})}).then(function(r){
      $('pw').value='';$('code').value='';
      var s={token:r.token,name:r.name};save(s);enter(s);
    }).catch(function(x){err.textContent=x.message==='Failed to fetch'?'مفيش اتصال. جرّب تاني':x.message}).then(function(){btn.disabled=false});
  });
  function enter(s){
    token=s.token;$('who').textContent=s.name;
    $('gate').hidden=true;$('app').hidden=false;
    refresh();loadTeam();clearInterval(timer);
    timer=setInterval(function(){if(!document.hidden)refresh()},60000);
  }
  function signOut(){
    token='';current=null;save(null);clearInterval(timer);
    showTab('chats');$('teamTab').hidden=true;$('teamCode').hidden=true;
    $('app').hidden=true;$('gate').hidden=false;setMode(false);
  }
  $('logout').onclick=signOut;

  /* tabs */
  function showTab(v){
    document.querySelectorAll('.tab').forEach(function(x){x.setAttribute('aria-selected',x.dataset.v===v?'true':'false')});
    ['chats','sales','team'].forEach(function(id){$(id).hidden=id!==v});
  }
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){showTab(t.dataset.v)}});

  /* team, admins only: the server decides, a 403 keeps the tab hidden */
  function showCode(name,code){
    var box=$('teamCode');box.textContent='';
    box.appendChild(document.createTextNode('كود التفعيل لـ'+name+': '));
    box.appendChild(el('b',null,code));
    box.appendChild(el('p','hint','ابعته له، وهو يفعّل حسابه ويختار كلمة السر بنفسه. الكود مش هيظهر هنا تاني.'));
    box.hidden=false;
  }
  function loadTeam(){
    return api('team_list').then(function(d){$('teamTab').hidden=false;renderMembers(d.members,d.me)}).catch(function(){$('teamTab').hidden=true});
  }
  function teamUpdate(m,extra){
    var b={id:m.id};for(var k in extra)b[k]=extra[k];
    $('teamErr').textContent='';
    api('team_update',b).then(function(r){if(r.code)showCode(m.name||m.email,r.code);return loadTeam()}).catch(function(x){$('teamErr').textContent=x.message});
  }
  function renderMembers(items,me){
    var box=$('members');box.textContent='';
    var t=el('table'),head=el('thead'),hr=el('tr');
    ['الاسم','الإيميل','الصلاحية','الحالة','إجراءات'].forEach(function(x){hr.appendChild(el('th',null,x))});
    head.appendChild(hr);t.appendChild(head);
    var bd=el('tbody');
    items.forEach(function(m){
      var r=el('tr');
      r.appendChild(el('td',null,m.name||'—'));
      var e=el('td');e.appendChild(el('span','ph',m.email));r.appendChild(e);
      r.appendChild(el('td',null,m.role==='admin'?'مدير':'موظف'));
      var s=el('td');s.appendChild(!m.active?el('span','pill off','موقوف'):m.activated?el('span','pill on','مفعّل'):el('span','pill','مستني التفعيل'));r.appendChild(s);
      var a=el('td'),w=el('div','rowacts');
      if(m.email.toLowerCase()!==me){
        var role=el('button','btn ghost',m.role==='admin'?'خلّيه موظف':'خلّيه مدير');role.type='button';
        role.onclick=function(){teamUpdate(m,{op:'role',role:m.role==='admin'?'member':'admin'})};
        var act=el('button','btn ghost',m.active?'وقّف الحساب':'شغّل الحساب');act.type='button';
        act.onclick=function(){if(!m.active||confirm('توقف حساب '+(m.name||m.email)+'؟'))teamUpdate(m,{op:'active',active:!m.active})};
        w.appendChild(role);w.appendChild(act);
      }
      var reset=el('button','btn ghost','كود جديد');reset.type='button';
      reset.onclick=function(){if(confirm('كلمة السر الحالية هتتلغي ولازم يتفعّل الحساب تاني. نكمل؟'))teamUpdate(m,{op:'reset'})};
      w.appendChild(reset);a.appendChild(w);r.appendChild(a);
      bd.appendChild(r);
    });
    t.appendChild(bd);box.appendChild(t);
  }
  $('addMember').addEventListener('submit',function(e){
    e.preventDefault();
    var name=$('mName').value.trim(),btn=$('mSend'),err=$('teamErr');
    err.textContent='';btn.disabled=true;
    api('team_add',{name:name,email:$('mEmail').value.trim(),role:$('mRole').value}).then(function(r){
      showCode(name,r.code);$('mName').value='';$('mEmail').value='';$('mRole').value='member';return loadTeam();
    }).catch(function(x){err.textContent=x.message}).then(function(){btn.disabled=false});
  });

  /* data */
  function refresh(){
    return api('list').then(function(d){
      renderStats(d.stats);renderList(d.conversations);renderSales(d.sales);
      if(current)openThread(current,true);
    }).catch(function(){});
  }
  function renderStats(s){
    var box=$('stats');box.textContent='';
    [['محادثات Nile',s.conversations],['نشطة النهارده',s.today],['آخر رسالة من العميل',s.waiting],['البوت موقوف',s.paused],['طلبات مبيعات',s.leads]].forEach(function(x){
      var d=el('div');d.appendChild(el('b',null,x[1]));d.appendChild(el('span',null,x[0]));box.appendChild(d);
    });
  }
  function renderList(items){
    var box=$('list');box.textContent='';
    if(!items.length){box.appendChild(el('p','empty','لسه مفيش محادثات Nile'));return}
    items.forEach(function(c){
      var b=el('button','conv');b.type='button';
      if(c.phone===current)b.setAttribute('aria-current','true');
      var r=el('div','row1');r.appendChild(el('b',null,c.name||c.phone));r.appendChild(el('time',null,when(c.lastAt)));
      b.appendChild(r);b.appendChild(el('p',null,c.last));
      if(c.paused)b.appendChild(el('span','pill off','البوت موقوف'));
      b.onclick=function(){openThread(c.phone,false);renderList(items)};
      box.appendChild(b);
    });
  }
  function openThread(phone,quiet){
    var mine=++seq;current=phone;$('chats').classList.add('open');
    return api('thread',{phone:phone}).then(function(t){
      if(mine!==seq)return;
      var keep=$('reply')?$('reply').value:'';
      var msgBox=$('msgs'),atEnd=!msgBox||msgBox.scrollHeight-msgBox.scrollTop-msgBox.clientHeight<60;
      renderThread(t);
      if(quiet&&keep&&$('reply'))$('reply').value=keep;
      var m=$('msgs');if(atEnd||!quiet)m.scrollTop=m.scrollHeight;
    }).catch(function(x){if(!quiet)showThreadError(x.message)});
  }
  function showThreadError(t){var box=$('thread');box.textContent='';box.appendChild(el('p','empty',t))}
  function setBot(phone,action){
    return api(action,{phone:phone}).then(function(){return refresh()}).catch(function(x){alert(x.message)});
  }
  function renderThread(t){
    var box=$('thread');box.textContent='';
    var h=el('div','thead'),left=el('div');
    var back=el('button','btn ghost back','رجوع');back.type='button';
    back.onclick=function(){current=null;$('chats').classList.remove('open')};
    var title=el('h2');title.appendChild(el('span','ph',t.phone));left.appendChild(title);
    var st=el('div');st.appendChild(el('span','pill '+(t.paused?'off':'on'),t.paused?'البوت موقوف':'البوت شغال'));
    left.appendChild(st);
    var ctl=el('div');ctl.style.display='flex';ctl.style.gap='8px';
    var tog=el('button','btn '+(t.paused?'go':'ghost'),t.paused?'خلّي البوت يكمل':'وقّف البوت');tog.type='button';
    tog.onclick=function(){tog.disabled=true;setBot(t.phone,t.paused?'resume':'pause')};
    ctl.appendChild(back);ctl.appendChild(tog);
    h.appendChild(left);h.appendChild(ctl);box.appendChild(h);

    var m=el('div','msgs');m.id='msgs';
    t.messages.forEach(function(x){
      var text=String(x.text||'');
      var manual=x.dir==='out'&&text.indexOf('[يدوي]')>-1;
      var b=el('div','m '+(x.dir==='in'?'in':'out')+(manual?' manual':''),text.replace('[يدوي] ',''));
      b.appendChild(el('small',null,(x.dir==='in'?'العميل':(manual?'رد يدوي':'البوت'))+' · '+when(x.at)));
      m.appendChild(b);
    });
    box.appendChild(m);

    var c=el('form','compose');
    if(t.canReply){
      var ta=el('textarea');ta.id='reply';ta.placeholder='اكتب ردك للعميل';ta.setAttribute('aria-label','ردك للعميل');ta.maxLength=2000;
      var acts=el('div','acts');
      var hint=el('p','hint',t.paused?'البوت موقوف، والرد هيتبعت من رقم الواتساب.':'لما تبعت رد، البوت هيقف للعميل ده لحد ما تضغط "خلّي البوت يكمل".');
      var send=el('button','btn','ابعت');send.type='submit';
      acts.appendChild(hint);acts.appendChild(send);c.appendChild(ta);c.appendChild(acts);
      c.addEventListener('submit',function(e){
        e.preventDefault();var text=ta.value.trim();if(!text)return;
        send.disabled=true;
        api('reply',{phone:t.phone,text:text}).then(function(){ta.value='';setTimeout(refresh,2500)}).catch(function(x){alert(x.message)}).then(function(){send.disabled=false});
      });
    }else{
      c.appendChild(el('p','hint','عدّت 24 ساعة من آخر رسالة للعميل، فواتساب مش هيسمح برد من هنا. كلّمه مباشرة من الموبايل.'));
    }
    box.appendChild(c);
  }
  function renderSales(items){
    var box=$('sales');box.textContent='';
    if(!items.length){box.appendChild(el('p','empty','لسه مفيش طلبات'));return}
    var t=el('table'),head=el('thead'),hr=el('tr');
    ['العميل','الموبايل','المطلوب','تفاصيل','المصدر','الوقت'].forEach(function(x){hr.appendChild(el('th',null,x))});
    head.appendChild(hr);t.appendChild(head);
    var bd=el('tbody');
    items.forEach(function(s){
      var r=el('tr');
      r.appendChild(el('td',null,s.name||'—'));
      var p=el('td');p.appendChild(el('span','ph',s.phone));r.appendChild(p);
      r.appendChild(el('td',null,s.what||'—'));
      r.appendChild(el('td',null,s.notes||'—'));
      var k=el('td');k.appendChild(el('span','pill',s.kind));r.appendChild(k);
      r.appendChild(el('td',null,when(s.at)));
      bd.appendChild(r);
    });
    t.appendChild(bd);box.appendChild(t);
  }

  var s=load();if(s&&s.token)enter(s);
})();
</script>
</body>
</html>
