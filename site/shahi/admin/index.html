<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>شاهي — لوحة الفريق</title>
<meta name="theme-color" content="#1E1410">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#1E1410;--gold:#C9963B;--gold-2:#a97a2b;--cream:#F3E9D6;--paper:#faf6ee;--line:#e6d8bf;--ink:#1E1410;--muted:#7a6650;--red:#b03a2e;--green:#2e7d4f;--blue:#2f5d8a}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit}
a{color:inherit}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--bg);border-color:var(--bg);color:var(--cream)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:600}
.btn.danger{color:var(--red);border-color:#e9c4bf}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);min-height:40px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,150,59,.18)}
label.f{display:block}
label.f > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:640px){.grid{grid-template-columns:1fr}}

/* login */
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 40%,#3a2a1f,var(--bg));padding:20px}
.lbox{width:min(380px,100%);background:var(--paper);border-radius:22px;padding:30px 26px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lbox .logo{text-align:center;margin-bottom:18px}
.lbox .logo svg{width:70px;height:48px;color:var(--gold);margin:0 auto}
.lbox .logo b{display:block;font-family:"Reem Kufi",sans-serif;font-size:34px;line-height:1.1}
.lbox .logo small{display:block;letter-spacing:.5em;color:var(--gold-2);font-size:11px}
.lbox form{display:grid;gap:12px}
.lbox .msg{font-size:14px;color:var(--red);min-height:20px}
.lbox .msg.ok{color:var(--green)}
.linkbtn{background:none;border:0;color:var(--gold-2);cursor:pointer;padding:4px;text-decoration:underline}

/* app shell */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);color:var(--cream);display:flex;align-items:center;gap:14px;padding:10px 18px}
header.top .brand{display:flex;align-items:center;gap:8px;font-family:"Reem Kufi",sans-serif;font-size:22px}
header.top .brand svg{width:34px;height:24px;color:var(--gold)}
header.top .who{margin-inline-start:auto;font-size:13px;text-align:end;line-height:1.3}
header.top .who small{display:block;color:var(--gold)}
header.top .btn{background:transparent;color:var(--cream);border-color:rgba(201,150,59,.4)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:60px;z-index:19;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
main{padding:18px;max-width:1280px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:14px}
.bar > *{flex:0 1 auto}
.bar input,.bar select{width:auto;min-width:130px}
.bar .grow{flex:1 1 200px}
.bar .grow input{width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px}

table.list{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
table.list th{background:#f4ecdc;text-align:start;font-weight:600;font-size:13px;color:var(--muted);padding:10px}
table.list td{border-top:1px solid var(--line);padding:10px;vertical-align:top}
table.list tr.row{cursor:pointer}
table.list tr.row:hover td{background:#fdf9f1}
@media (max-width:760px){
  table.list thead{display:none}
  table.list,table.list tbody,table.list tr,table.list td{display:block;width:100%}
  table.list tr{border-top:1px solid var(--line);padding:8px 4px}
  table.list td{border:0;padding:2px 8px}
  table.list td[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}
}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:#efe6d4;white-space:nowrap}
.st-new{background:#fde9c7;color:#8a5a00}.st-contacted{background:#e3ecf7;color:var(--blue)}.st-menu_sent{background:#ece3f6;color:#6a3d9a}
.st-booked{background:#dcefe3;color:var(--green)}.st-done{background:#d9e6dd;color:#1f5a38}.st-cancelled{background:#f4dcd8;color:var(--red)}
.st-confirmed{background:#dcefe3;color:var(--green)}

/* drawer / modal */
.shade{position:fixed;inset:0;background:rgba(20,12,8,.5);z-index:40}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(560px,100%);background:var(--paper);z-index:41;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--bg);color:var(--cream)}
.drawer .dh h2{font-size:18px;flex:1}
.drawer .dh .x{background:none;border:0;color:var(--cream);font-size:26px;cursor:pointer;line-height:1}
.drawer .db{overflow-y:auto;padding:18px;flex:1;display:grid;gap:14px;align-content:start}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:#fff}
.section-t{font-weight:600;margin:4px 0 -4px;color:var(--gold-2)}
.notes{display:grid;gap:8px}
.note{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.note small{color:var(--muted);display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv b{color:var(--muted);font-weight:500}
.money{direction:ltr;unicode-bidi:isolate}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg);color:var(--cream);padding:10px 18px;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px}
.cal .day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;font-size:12px}
.cal .day.out{opacity:.45}
.cal .day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.cal .day .n{font-weight:600;margin-bottom:4px}
.ev{display:block;width:100%;text-align:start;border:0;border-radius:8px;padding:3px 6px;margin-bottom:3px;background:#f4ecdc;cursor:pointer;font-size:12px;line-height:1.35}
.ev.done{background:#d9e6dd}.ev.cancelled{background:#f4dcd8;text-decoration:line-through}
.agenda{display:grid;gap:8px}
.agenda .ag{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.agenda .ag .tm{font-weight:600;min-width:120px}
@media (max-width:760px){.cal .day{min-height:70px;padding:4px}.cal .ev .nm{display:none}}

/* kitchen */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.kcard h3{font-size:17px}
.kcard ul{margin:8px 0;padding-inline-start:18px}
.alert{background:#fbe5e1;color:var(--red);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px}

/* reports */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.stat b{display:block;font-size:24px;font-family:"Reem Kufi",sans-serif}
.bars{display:grid;gap:6px}
.barrow{display:grid;grid-template-columns:140px 1fr 60px;gap:8px;align-items:center;font-size:14px}
.barrow i{display:block;height:10px;border-radius:6px;background:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.two{grid-template-columns:1fr}.barrow{grid-template-columns:100px 1fr 44px}}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.chk input[type=checkbox]{width:18px;height:18px;min-height:0;flex:none}
.chk input.note{flex:1}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cloche" viewBox="0 0 64 44"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 38h56"/><path d="M8 35a24 24 0 0 1 48 0"/><circle cx="32" cy="8" r="2.8"/></g></symbol>
</svg>

<!-- LOGIN -->
<section id="login">
  <div class="lbox">
    <div class="logo"><svg><use href="#cloche"/></svg><b>شاهي</b><small>SHAHI · TEAM</small></div>
    <form id="loginForm">
      <label class="f"><span>الإيميل</span><input id="lEmail" type="email" autocomplete="username" dir="ltr" required></label>
      <label class="f"><span>الباسورد</span><input id="lPass" type="password" autocomplete="current-password" dir="ltr" required></label>
      <button class="btn primary" type="submit">دخول</button>
      <div class="msg" id="lMsg"></div>
      <button class="linkbtn" type="button" id="forgotBtn">نسيت الباسورد؟</button>
    </form>
    <form id="forgotForm" class="hidden">
      <p class="small muted" style="margin:0">اكتب إيميلك وهيوصلك رابط تعمل منه باسورد جديدة.</p>
      <label class="f"><span>الإيميل</span><input id="fEmail" type="email" dir="ltr" required></label>
      <button class="btn primary" type="submit">ابعت الرابط</button>
      <div class="msg" id="fMsg"></div>
      <button class="linkbtn" type="button" id="backLogin">رجوع للدخول</button>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><svg><use href="#cloche"/></svg>شاهي</div>
    <div class="who"><span id="whoName"></span><small id="whoRole"></small></div>
    <button class="btn sm" id="logout">خروج</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
</div>

<div id="overlay"></div>

<script>
const sb = supabase.createClient("https://snrsfpprlynixotjipmo.supabase.co", "sb_publishable_Q9zcnd6bo1cM4VDRysyjbA_XBr6lhds");
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const money = v => v == null || v === "" ? "—" : Number(v).toLocaleString("en-US") + " ج";
const dt = v => v ? new Date(v).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" }) : "—";
const dOnly = v => v ? new Date(v + (String(v).length === 10 ? "T00:00" : "")).toLocaleDateString("ar-EG", { dateStyle: "medium" }) : "—";
const iso = d => d.toLocaleDateString("en-CA");
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const must = ({ data, error }) => { if (error) throw error; return data; };
const fail = e => { console.error(e); toast("حصلت مشكلة: " + (e?.message || e)); };

const STATUS = { new:"جديد", contacted:"تم التواصل", menu_sent:"اتبعت المنيو", booked:"اتحجز (عربون)", done:"اتنفذ", cancelled:"اتلغى" };
const SOURCE = { website:"الموقع", whatsapp:"واتساب", ad:"إعلان", facebook:"فيسبوك", instagram:"إنستجرام", tiktok:"تيك توك", phone:"تليفون", other:"أخرى" };
const BSTATUS = { confirmed:"مأكد", done:"اتنفذ", cancelled:"اتلغى" };
const ROLE = { admin:"أدمن (شريك)", sales:"مبيعات وخدمة عملاء", ops:"تشغيل", chef:"مطبخ" };
const PAYKIND = { deposit:"عربون", balance:"باقي المبلغ", other:"أخرى" };
const CAT = { gathering:"عزومات (باكدجات)", a_la_carte:"أطباق حسب الطلب", dessert:"حلو", drink:"مشروبات", meal_prep:"Meal Prep" };
const opts = (map, sel, blank) => (blank != null ? `<option value="">${esc(blank)}</option>` : "") + Object.entries(map).map(([k, v]) => `<option value="${k}"${k === sel ? " selected" : ""}>${esc(v)}</option>`).join("");
const waLink = phone => "https://wa.me/" + String(phone || "").replace(/\D/g, "");

let me = null, staff = [], packages = [], menuItems = [];
const TABS = [
  { id:"leads", label:"الطلبات", roles:["admin","sales"] },
  { id:"cal", label:"الحجوزات والكالندر", roles:["admin","sales","ops"] },
  { id:"kitchen", label:"المطبخ", roles:["admin","ops","chef"] },
  { id:"customers", label:"العملاء", roles:["admin","sales"] },
  { id:"menu", label:"المنيو والباكدجات", roles:["admin"] },
  { id:"team", label:"الفريق", roles:["admin"] },
  { id:"reports", label:"التقارير", roles:["admin"] },
  { id:"log", label:"سجل النشاط", roles:["admin"] },
  { id:"settings", label:"الإعدادات", roles:["admin"] }
];
const can = (...roles) => me && roles.includes(me.role);

// ---------- auth ----------
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#lMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lEmail").value.trim(), password: $("#lPass").value });
  if (error) { $("#lMsg").textContent = "الإيميل أو الباسورد غلط، أو الحساب موقوف."; return; }
  start();
});
$("#forgotBtn").onclick = () => { $("#loginForm").classList.add("hidden"); $("#forgotForm").classList.remove("hidden"); $("#fEmail").value = $("#lEmail").value; };
$("#backLogin").onclick = () => { $("#forgotForm").classList.add("hidden"); $("#loginForm").classList.remove("hidden"); };
$("#forgotForm").addEventListener("submit", async e => {
  e.preventDefault();
  const redirectTo = new URL("reset.html", location.href).href;
  const { error } = await sb.auth.resetPasswordForEmail($("#fEmail").value.trim(), { redirectTo });
  $("#fMsg").className = "msg" + (error ? "" : " ok");
  $("#fMsg").textContent = error ? "مقدرناش نبعت الرابط. كلّم الأدمن يغيّرلك الباسورد من «الفريق»." : "لو الإيميل مسجّل عندنا هيوصلك رابط خلال دقايق.";
});
$("#logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start(){
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return;
  const { data } = await sb.from("shahi_staff").select("*").eq("user_id", user.id).maybeSingle();
  if (!data || !data.active) { await sb.auth.signOut(); $("#lMsg").textContent = "الحساب ده مش مفعّل في فريق شاهي. كلّم الأدمن."; return; }
  me = data;
  $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  $("#whoName").textContent = me.full_name; $("#whoRole").textContent = ROLE[me.role];
  const mine = TABS.filter(t => t.roles.includes(me.role));
  $("#tabs").innerHTML = mine.map(t => `<button data-t="${t.id}">${esc(t.label)}</button>`).join("");
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.t); };
  await loadRefs();
  let first = mine[0].id; try { const k = sessionStorage.getItem("shahi_tab"); if (mine.some(t => t.id === k)) first = k; } catch (_) {}
  show(first);
}
async function loadRefs(){
  [staff, packages, menuItems] = await Promise.all([
    sb.from("shahi_staff").select("user_id,full_name,role,active,email").order("full_name").then(must),
    sb.from("shahi_packages").select("*,shahi_package_items(menu_item_id,note,sort)").order("sort").then(must),
    sb.from("shahi_menu_items").select("*").order("category").order("sort").then(must)
  ]);
}
const staffName = id => staff.find(s => s.user_id === id)?.full_name || "—";
const pkgName = id => packages.find(p => p.id === id)?.name_ar || "—";
function show(id){
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  try { sessionStorage.setItem("shahi_tab", id); } catch (_) {}
  ({ leads, cal, kitchen, customers, menu, team, reports, log, settings })[id]().catch(fail);
}

// ---------- drawer helper ----------
function drawer(title, body, foot){
  $("#overlay").innerHTML = `<div class="shade"></div><aside class="drawer" role="dialog" aria-modal="true"><div class="dh"><h2>${esc(title)}</h2><button class="x" aria-label="إغلاق">×</button></div><div class="db">${body}</div>${foot ? `<div class="df">${foot}</div>` : ""}</aside>`;
  const close = () => { $("#overlay").innerHTML = ""; };
  $("#overlay .shade").onclick = close; $("#overlay .x").onclick = close;
  return { el: $("#overlay .drawer"), close };
}
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#overlay").innerHTML = ""; });

// ========== LEADS ==========
let leadFilter = { status:"", source:"", area:"", from:"", to:"", q:"" };
async function leads(){
  $("#main").innerHTML = `<div class="bar">
    <label class="f"><span>الحالة</span><select id="lfS">${opts(STATUS, leadFilter.status, "الكل")}</select></label>
    <label class="f"><span>المصدر</span><select id="lfSrc">${opts(SOURCE, leadFilter.source, "الكل")}</select></label>
    <label class="f"><span>المنطقة</span><input id="lfA" value="${esc(leadFilter.area)}" placeholder="أي منطقة"></label>
    <label class="f"><span>من</span><input id="lfF" type="date" value="${leadFilter.from}"></label>
    <label class="f"><span>إلى</span><input id="lfT" type="date" value="${leadFilter.to}"></label>
    <label class="f grow"><span>بحث</span><input id="lfQ" value="${esc(leadFilter.q)}" placeholder="اسم أو موبايل"></label>
    <button class="btn gold" id="newLead">+ طلب جديد</button></div><div id="leadList"><p class="empty">بيحمّل…</p></div>`;
  const read = () => { leadFilter = { status:$("#lfS").value, source:$("#lfSrc").value, area:$("#lfA").value.trim(), from:$("#lfF").value, to:$("#lfT").value, q:$("#lfQ").value.trim() }; loadLeads(); };
  ["#lfS","#lfSrc","#lfF","#lfT"].forEach(s => $(s).onchange = read);
  ["#lfA","#lfQ"].forEach(s => $(s).oninput = () => { clearTimeout(window._lt); window._lt = setTimeout(read, 300); });
  $("#newLead").onclick = () => openLead(null);
  loadLeads();
}
async function loadLeads(){
  let q = sb.from("shahi_leads").select("*").order("created_at", { ascending:false }).limit(300);
  const f = leadFilter;
  if (f.status) q = q.eq("status", f.status);
  if (f.source) q = q.eq("source", f.source);
  if (f.area) q = q.ilike("area", `%${f.area}%`);
  if (f.from) q = q.gte("created_at", f.from);
  if (f.to) q = q.lt("created_at", iso(addDays(f.to, 1)));
  if (f.q) { const s = f.q.replace(/[%,()]/g, ""); q = q.or(`name.ilike.%${s}%,phone.ilike.%${s.replace(/^0/, "")}%`); }
  const rows = await q.then(must);
  $("#leadList").innerHTML = rows.length ? `<table class="list"><thead><tr><th>وصل</th><th>العميل</th><th>المنطقة</th><th>ميعاد العزومة</th><th>العدد</th><th>الباكدج</th><th>المصدر</th><th>الحالة</th></tr></thead><tbody>${rows.map(r => `

// same normalisation as the database (shahi_phone)
function normPhone(p){
  const n = String(p).replace(/\D/g, "");
  if (/^01[0125]\d{8}$/.test(n)) return "+2" + n;
  if (/^201[0125]\d{8}$/.test(n)) return "+" + n;
  if (/^00201[0125]\d{8}$/.test(n)) return "+" + n.slice(2);
  if (/^1[0125]\d{8}$/.test(n)) return "+20" + n;
  return "+" + n;
}

let calView = "month", calDate = new Date();
async function cal(){
  $("#main").innerHTML = `<div class="bar">
    <div style="display:flex;gap:4px">${["day","week","month","list"].map(v => `<button class="btn sm${calView === v ? " primary" : ""}" data-v="${v}">${({ day:"يوم", week:"أسبوع", month:"شهر", list:"القادم" })[v]}</button>`).join("")}</div>
    <div style="display:flex;gap:4px;align-items:center"><button class="btn sm" id="cPrev">→ السابق</button><button class="btn sm" id="cToday">النهارده</button><button class="btn sm" id="cNext">التالي ←</button></div>
    <b id="cTitle"></b></div><div id="calBody"><p class="empty">بيحمّل…</p></div>`;
  $$(".bar [data-v]").forEach(b => b.onclick = () => { calView = b.dataset.v; cal(); });
  const step = n => { if (calView === "day") calDate = addDays(calDate, n); else if (calView === "week") calDate = addDays(calDate, 7 * n); else calDate = new Date(calDate.getFullYear(), calDate.getMonth() + n, 1); cal(); };
  $("#cPrev").onclick = () => step(-1); $("#cNext").onclick = () => step(1); $("#cToday").onclick = () => { calDate = new Date(); cal(); };
  let from, to;
  if (calView === "day") { from = new Date(calDate.toDateString()); to = addDays(from, 1); }
  else if (calView === "week") { from = addDays(new Date(calDate.toDateString()), -((calDate.getDay() + 1) % 7)); to = addDays(from, 7); }   // week starts Saturday
  else if (calView === "month") { const f = new Date(calDate.getFullYear(), calDate.getMonth(), 1); from = addDays(f, -((f.getDay() + 1) % 7)); to = addDays(from, 42); }
  else { from = new Date(new Date().toDateString()); to = addDays(from, 120); }
  $("#cTitle").textContent = calView === "month" ? calDate.toLocaleDateString("ar-EG", { month:"long", year:"numeric" })
    : calView === "list" ? "الحجوزات القادمة" : `${dOnly(iso(from))} – ${dOnly(iso(addDays(to, -1)))}`;
  const rows = await sb.from("shahi_bookings").select("*,shahi_customers(name,phone)").gte("event_at", from.toISOString()).lt("event_at", to.toISOString()).order("event_at").then(must);
  const label = b => `${new Date(b.event_at).toTimeString().slice(0, 5)} · ${b.guests} فرد`;

    $("#calBody").innerHTML = `<div class="cal">${["سبت","أحد","اتنين","تلات","أربع","خميس","جمعة"].map(d => `<div class="dow">${d}</div>`).join("")}${Array.from({ length: 42 }, (_, i) => {
      const day = addDays(from, i), k = iso(day), evs = rows.filter(b => iso(new Date(b.event_at)) === k);
      return `<div class="day${day.getMonth() !== m ? " out" : ""}${k === today ? " today" : ""}"><div class="n">${day.getDate()}</div>${evs.map(b => `<button class="ev ${b.status}" data-id="${b.id}">${label(b)}<span class="nm"><br>${esc(b.shahi_customers?.name || "")}</span></button>`).join("")}</div>`;
    }).join("")}</div>`;
  } else {
    $("#calBody").innerHTML = rows.length ? `<div class="agenda">${rows.map(b => `<div class="ag" data-id="${b.id}"><div class="tm">${dt(b.event_at)}</div><div style="flex:1"><b>${esc(b.shahi_customers?.name || "—")}</b> · ${b.guests} فرد · ${esc(pkgName(b.package_id))}<div class="small muted">${esc(b.area || "")} ${esc(b.address || "")}</div></div><span class="badge st-${b.status}">${esc(BSTATUS[b.status])}</span></div>`).join("")}</div>`
      : `<p class="empty">مفيش حجوزات في الفترة دي.</p>`;
  }
  $$("#calBody [data-id]").forEach(el => el.onclick = () => openBooking(el.dataset.id));

    if (p === "m") { $("#rF").value = f0; $("#rT").value = t0; }
    if (p === "lm") { $("#rF").value = iso(new Date(n.getFullYear(), n.getMonth() - 1, 1)); $("#rT").value = iso(new Date(n.getFullYear(), n.getMonth(), 0)); }
    if (p === "90") { $("#rF").value = iso(addDays(n, -90)); $("#rT").value = iso(n); }
    load().catch(fail); });
  await load();
}

// ========== ACTIVITY LOG ==========
const ENT = { shahi_leads:"طلب", shahi_bookings:"حجز", shahi_payments:"دفعة", shahi_customers:"عميل", shahi_packages:"باكدج", shahi_menu_items:"صنف", shahi_package_items:"صنف في باكدج",
  shahi_meal_plans:"اشتراك", shahi_staff:"عضو فريق", shahi_settings:"إعداد", shahi_lead_notes:"ملاحظة" };
const ACT = { insert:"أضاف", update:"عدّل", delete:"مسح" };
async function log(){
  const rows = await sb.from("shahi_activity_log").select("*").order("at", { ascending:false }).limit(200).then(must);
  $("#main").innerHTML = rows.length ? `<table class="list"><thead><tr><th>الوقت</th><th>مين</th><th>عمل إيه</th><th>التفاصيل</th></tr></thead><tbody>${rows.map(r => `<tr>
    <td data-l="الوقت">${dt(r.at)}</td><td data-l="مين">${esc(staffName(r.actor) !== "—" ? staffName(r.actor) : (r.actor_email || "الموقع / البوت"))}</td>
    <td>${esc(ACT[r.action] || r.action)} ${esc(ENT[r.entity] || r.entity)}</td>
    <td class="small muted" style="max-width:420px;word-break:break-word">${esc(summary(r.details))}</td></tr>`).join("")}</tbody></table>` : `<p class="empty">السجل فاضي.</p>`;
}
function summary(d){
  if (!d) return "";
  return Object.entries(d).filter(([k]) => !["id","customer_id","lead_id","booking_id","package_id","menu_item_id","user_id","created_by","recorded_by","author"].includes(k))
    .slice(0, 6).map(([k, v]) => `${k}: ${typeof v === "object" ? JSON.stringify(v) : v}`).join(" · ").slice(0, 300);
}

// ========== SETTINGS ==========
async function settings(){
  const rows = await sb.from("shahi_settings").select("*").then(must);
  const S = Object.fromEntries(rows.map(r => [r.key, r.value ?? ""]));
  const fields = [
    ["public.whatsapp_number", "رقم واتساب الحجز (بالصيغة الدولية من غير +)", "201111126938", "ltr"],
    ["public.whatsapp_text", "رسالة الواتساب الجاهزة (لازم فيها كلمة «شاهي» عشان البوت)", "", "rtl"],
    ["public.service_areas", "المناطق اللي بنخدمها (افصل بفاصلة)", "6 أكتوبر، الشيخ زايد", "rtl"],
    ["public.email", "إيميل التواصل", "", "ltr"],
    ["public.meta_pixel_id", "Meta Pixel ID (أرقام بس)", "", "ltr"],
    ["public.gallery", "صور المعرض (لينك كل صورة في سطر، لحد 3)", "", "ltr"]
  ];
  $("#main").innerHTML = `<div class="card" style="max-width:720px"><h2 style="margin-bottom:12px">إعدادات الموقع</h2><form id="sf" class="grid">${fields.map(([k, l, ph, dir]) =>
    `<label class="f full"><span>${esc(l)}</span>${k === "public.gallery" ? `<textarea name="${k}" dir="${dir}" placeholder="https://…">${esc(S[k])}</textarea>` : `<input name="${k}" value="${esc(S[k])}" placeholder="${esc(ph)}" dir="${dir}">`}</label>`).join("")}</form>
    <div style="margin-top:12px"><button class="btn primary" id="sSave">حفظ</button></div></div>`;
  $("#sSave").onclick = async () => {
    const v = Object.fromEntries(new FormData($("#sf")));
    if (v["public.whatsapp_text"] && !v["public.whatsapp_text"].includes("شاهي")) return toast("رسالة الواتساب لازم يكون فيها كلمة «شاهي»");
    if (v["public.meta_pixel_id"] && !/^\d{6,20}$/.test(v["public.meta_pixel_id"])) return toast("الـ Pixel ID أرقام بس");
    try { await sb.from("shahi_settings").upsert(Object.entries(v).map(([key, value]) => ({ key, value: value.trim() || null, updated_at: new Date().toISOString() }))).then(must); toast("اتحفظ ✓ وظهر على الموقع"); } catch (e) { fail(e); }
  };
}
